<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|StockLog - ${friend.username}님의 자산|">StockLog - 친구 포트폴리오</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
    :root {
        --content-max: 1100px;
    }

        .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--label-text); cursor: pointer; text-decoration: none; padding: 8px 12px; border-radius: 8px; transition: 0.15s; margin-left: -12px; }
        .back-btn:hover { background: var(--canvas); color: var(--ink); }

        .profile-avatar { width: 56px; height: 56px; border-radius: 16px; background: var(--mist); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: white; flex-shrink: 0; }

        .text-up   { color: var(--toss-red-deep)   !important; }
        .text-down { color: var(--toss-blue-deep)  !important; }
        .num { font-variant-numeric: tabular-nums; }

        .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
        .summary-tile { background: var(--surface-soft); border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: 16px 18px; }
        .summary-label { font-size: 13px; font-weight: 600; color: var(--label-text); margin-bottom: 6px; }
        .summary-value { font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1.2; }
        .summary-foot { font-size: 12px; font-weight: 600; color: var(--label-text); margin-top: 6px; word-break: keep-all; }

        .stock-row { display: flex; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--canvas); gap: 14px; }
        .stock-row:last-child { border-bottom: none; }
        .stock-icon  { width: 40px; height: 40px; border-radius: 10px; background: var(--canvas); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--slate); flex-shrink: 0; }
        .stock-name  { font-size: 15px; font-weight: 700; color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; }
        .stock-meta  { font-size: 13px; font-weight: 500; color: var(--label-text); margin-top: 2px; }
        .price-col   { text-align: right; flex-shrink: 0; min-width: 110px; }
        .price-main  { font-size: 15px; font-weight: 700; color: var(--ink); }
        .price-sub   { font-size: 12px; font-weight: 500; color: var(--label-text); margin-top: 2px; }
        .return-col  { text-align: right; flex-shrink: 0; min-width: 76px; font-size: 15px; font-weight: 800; }

        .empty-state { text-align: center; padding: 48px 0; color: var(--label-text); }
        .empty-state i { font-size: 2rem; display: block; margin-bottom: 12px; color: var(--haze); }

        @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .fu { animation: fadeUp 0.3s ease both; }
        .d1 { animation-delay: 0.05s; }
        .d2 { animation-delay: 0.10s; }
        .d3 { animation-delay: 0.15s; }

        @media (max-width: 768px) {

            .stock-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; }
            .stock-row .stock-icon { grid-row: 1 / span 2; }
            .stock-row .price-col { grid-column: 2; grid-row: 2; text-align: left; min-width: 0; display: flex; gap: 8px; align-items: baseline; }
            .stock-row .price-col .price-sub { margin-top: 0; }
            .stock-row .return-col { grid-column: 3; grid-row: 1 / span 2; min-width: 0; }
        }
    </style>
</head>
<body>
<div class="layout-wrapper">
    <aside th:replace="~{fragments/sidebar :: sidebarFragment('friends')}"></aside>

    <main class="main-content">
        <div th:replace="~{fragments/header :: headerFragment}"></div>

        <div class="content-container">

            <div class="mb-3 fu">
                <a th:href="@{/friends}" class="back-btn">
                    <i class="bi bi-chevron-left" aria-hidden="true"></i> 친구 목록
                </a>
            </div>

            <section class="toss-card fu d1" aria-labelledby="friend-name"
                     th:with="stocks=${portfolio.myStocks},
                              winCount=${portfolio.myStocks.?[returnRate != null and returnRate > 0].size()},
                              lossCount=${portfolio.myStocks.?[returnRate != null and returnRate < 0].size()},
                              avg=${portfolio.averageReturnRate}">
                <div class="d-flex align-items-center gap-3">
                    <div class="profile-avatar" aria-hidden="true"
                         th:text="${friend.username != null and !#strings.isEmpty(friend.username)}
                                  ? ${#strings.substring(friend.username, 0, 1)} : 'F'">F</div>
                    <div style="min-width: 0;">
                        <div class="fw-semibold" style="font-size: 13px; color: var(--label-text);">친구의 포트폴리오</div>
                        <h1 id="friend-name" class="fw-bold m-0 text-dark text-break" style="font-size: 24px;" th:text="${friend.username}">친구</h1>
                    </div>
                </div>

                <div class="summary-grid">
                    <div class="summary-tile">
                        <div class="summary-label">평균 수익률</div>
                        <div class="summary-value num"
                             th:classappend="${#lists.isEmpty(stocks) or avg == null or avg.signum() == 0} ? '' : (${avg.signum() > 0} ? 'text-up' : 'text-down')"
                             th:text="${#lists.isEmpty(stocks) or avg == null} ? '-' : (${avg.signum() > 0} ? '+' : '') + ${#numbers.formatDecimal(avg, 1, 2)} + '%'">-</div>
                        <div class="summary-foot"
                             th:text="${#lists.isEmpty(stocks)} ? '보유 종목 없음' : |수익 ${winCount} · 손실 ${lossCount} (종목 단순평균)|">보유 종목 없음</div>
                    </div>
                    <div class="summary-tile">
                        <div class="summary-label">보유 종목</div>
                        <div class="summary-value num" th:text="${#lists.size(stocks)} + '개'">0개</div>
                    </div>
                </div>
            </section>

            <section class="toss-card fu d2" aria-labelledby="holdings-title">
                <h2 id="holdings-title" class="fw-bold mb-3 text-dark" style="font-size: 18px;">보유 종목</h2>

                <div class="stock-row" th:each="stock : ${portfolio.myStocks}"
                     th:with="isKr=${stock.stockCode != null and stock.stockCode.matches('[0-9]{6}')},
                              rate=${stock.returnRate},
                              hasPrice=${stock.currentPrice != null and stock.currentPrice.signum() > 0}">
                    <div class="stock-icon" aria-hidden="true"
                         th:text="${stock.korName != null and !#strings.isEmpty(stock.korName)} ? ${#strings.substring(stock.korName, 0, 1)} : '?'">?</div>
                    <div class="flex-grow-1" style="min-width: 0;">
                        <div class="stock-name" th:text="${stock.korName ?: stock.stockCode}">종목</div>
                        <div class="stock-meta">
                            <span th:text="${stock.stockCode}">000000</span><span th:if="${stock.sector != null and !#strings.isEmpty(stock.sector)}" th:text="' · ' + ${stock.sector}"></span>
                        </div>
                    </div>
                    <div class="price-col">
                        <div class="price-main num"
                             th:text="${hasPrice} ? (${isKr} ? ${#numbers.formatDecimal(stock.currentPrice, 1, 'COMMA', 0, 'POINT')} + '원' : '$' + ${#numbers.formatDecimal(stock.currentPrice, 1, 'COMMA', 2, 'POINT')}) : '시세 없음'">-</div>
                        <div class="price-sub num"
                             th:text="'평단 ' + (${isKr} ? ${#numbers.formatDecimal(stock.averagePrice, 1, 'COMMA', 0, 'POINT')} + '원' : '$' + ${#numbers.formatDecimal(stock.averagePrice, 1, 'COMMA', 2, 'POINT')})">평단</div>
                    </div>
                    <div class="return-col num"
                         th:classappend="${!hasPrice or rate == null or rate.signum() == 0} ? '' : (${rate.signum() > 0} ? 'text-up' : 'text-down')"
                         th:text="${!hasPrice or rate == null} ? '-' : (${rate.signum() > 0} ? '+' : '') + ${#numbers.formatDecimal(rate, 1, 2)} + '%'">-</div>
                </div>

                <div th:if="${#lists.isEmpty(portfolio.myStocks)}" class="empty-state">
                    <div style="font-size: 14px; font-weight: 500;">현재 보유 중인 종목이 없어요</div>
                </div>
            </section>

        </div>
    </main>
</div>

</body>
</html>
