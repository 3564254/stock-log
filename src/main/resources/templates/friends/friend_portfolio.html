<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|StockLog - ${friend.username}님의 자산|">StockLog - 친구 포트폴리오</title>

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        :root {
            --toss-blue: #3182f6; --toss-red: #f04452; --toss-green: #05c072;
            --toss-gray-bg: #f2f4f6; --sidebar-width: 250px;
        }
        body { background-color: var(--toss-gray-bg); font-family: 'Pretendard', sans-serif; overflow-x: hidden; margin: 0; color: #191f28; }

        .layout-wrapper { display: flex; min-height: 100vh; }
        .main-content { flex-grow: 1; margin-left: var(--sidebar-width); padding: 0 60px 80px; transition: 0.3s; }
        .main-content.expanded { margin-left: 80px; }
        .content-container { max-width: 1100px; margin: 0 auto; padding-top: 32px; }

        .toss-card { background: white; border-radius: 16px; padding: 28px; box-shadow: none; border: 1px solid #e5e8eb; margin-bottom: 24px; }

        .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8b95a1; cursor: pointer; text-decoration: none; padding: 8px 12px; border-radius: 8px; transition: 0.15s; margin-left: -12px; }
        .back-btn:hover { background: #f2f4f6; color: #191f28; }

        .profile-avatar { width: 56px; height: 56px; border-radius: 16px; background: #8b95a1; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: white; flex-shrink: 0; }

        .text-up   { color: var(--toss-red)   !important; }
        .text-down { color: var(--toss-blue)  !important; }

        .profit-badge { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
        .badge-profit { background: rgba(240,68,82,0.08);  color: var(--toss-red);   }
        .badge-loss   { background: rgba(49,130,246,0.08); color: var(--toss-blue);  }

        .chart-wrap { position: relative; width: 160px; height: 160px; flex-shrink: 0; }
        .chart-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }

        .weight-bar-wrap { display: flex; height: 8px; border-radius: 99px; overflow: hidden; gap: 2px; margin-bottom: 16px; }
        .weight-bar-seg  { border-radius: 99px; height: 100%; }

        .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

        .stock-row { display: flex; align-items: center; padding: 16px 0; border-bottom: 1px solid #f2f4f6; gap: 14px; }
        .stock-row:last-child { border-bottom: none; }
        .stock-icon  { width: 40px; height: 40px; border-radius: 10px; background: #f2f4f6; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #4e5968; flex-shrink: 0; }
        .stock-name  { font-size: 15px; font-weight: 700; color: #191f28; }
        .stock-meta  { font-size: 13px; font-weight: 500; color: #8b95a1; margin-top: 2px; }
        .stock-value { font-size: 15px; font-weight: 700; color: #191f28; }

        .empty-state { text-align: center; padding: 48px 0; color: #8b95a1; }
        .empty-state i { font-size: 2rem; display: block; margin-bottom: 12px; color: #d1d6db; }

        @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .fu { animation: fadeUp 0.3s ease both; }
        .d1 { animation-delay: 0.05s; }
        .d2 { animation-delay: 0.10s; }
        .d3 { animation-delay: 0.15s; }

        @media (max-width: 768px) {
            .sidebar-main { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 16px !important; }
            .content-container { padding-top: 16px; }
            .toss-card { padding: 20px !important; }

            .d-flex.gap-5 { gap: 16px !important; }
            .d-flex.align-items-center.gap-5 { flex-direction: column !important; gap: 24px !important; }
            .chart-wrap { margin: 0 auto; }
            .stock-row { flex-direction: column; align-items: flex-start; gap: 12px; }
            .stock-row .flex-grow-1 { width: 100%; }
            .stock-row .text-end { text-align: left !important; display: flex; justify-content: space-between; width: 100%; align-items: center; }
        }
    </style>
</head>
<body x-data="{ sidebarOpen: true }">
<div class="layout-wrapper">
    <aside th:replace="~{fragments/sidebar :: sidebarFragment('friends')}"></aside>

    <main class="main-content" :class="!sidebarOpen ? 'expanded' : ''">
        <div th:replace="~{fragments/header :: headerFragment}"></div>

        <div class="content-container">

            <div class="mb-3 fu">
                <a th:href="@{/friends}" class="back-btn">
                    <i class="bi bi-chevron-left"></i> 목록으로 돌아가기
                </a>
            </div>

            <div class="toss-card fu d1">
                <div class="d-flex align-items-start gap-4 flex-wrap">

                    <div class="profile-avatar"
                         th:text="${friend.username != null and !#strings.isEmpty(friend.username)}
                                  ? ${#strings.substring(friend.username, 0, 1)} : 'F'">F</div>

                    <div class="flex-grow-1">
                        <div class="text-secondary fw-bold mb-1"
                             style="font-size: 13px;">친구가 보유한 자산</div>
                        <div class="fw-bold mb-4 text-dark"
                             style="font-size: 24px;"
                             th:text="${friend.username}"></div>

                        <div class="d-flex gap-5 flex-wrap">
                            <div>
                                <div style="font-size: 13px; color: #6b7684; font-weight: 500; margin-bottom: 4px;">총 자산</div>
                                <div class="fw-bold text-dark" style="font-size: 20px;"
                                     th:text="${#numbers.formatDecimal(portfolio.totalAssets, 0, 'COMMA', 0, 'POINT')} + '원'">0원</div>
                            </div>
                            <div>
                                <div style="font-size: 13px; color: #6b7684; font-weight: 500; margin-bottom: 4px;">총 평가손익</div>
                                <div class="fw-bold" style="font-size: 20px;"
                                     th:classappend="${portfolio.totalProfit >= 0 ? 'text-up' : 'text-down'}"
                                     th:text="${(portfolio.totalProfit >= 0 ? '+' : '') + #numbers.formatDecimal(portfolio.totalProfit, 0, 'COMMA', 0, 'POINT')} + '원'">+0원</div>
                            </div>
                            <div>
                                <div style="font-size: 13px; color: #6b7684; font-weight: 500; margin-bottom: 4px;">총 수익률</div>
                                <div class="fw-bold" style="font-size: 20px;"
                                     th:classappend="${portfolio.totalReturnRate >= 0 ? 'text-up' : 'text-down'}"
                                     th:text="${(portfolio.totalReturnRate >= 0 ? '+' : '') + portfolio.totalReturnRate + '%'}">+0%</div>
                            </div>
                            <div>
                                <div style="font-size: 13px; color: #6b7684; font-weight: 500; margin-bottom: 4px;">보유 종목수</div>
                                <div class="fw-bold text-dark" style="font-size: 20px;"
                                     th:text="${#lists.size(portfolio.myStocks)} + '개'">0개</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="toss-card fu d2" th:if="${!#lists.isEmpty(portfolio.myStocks)}">
                <h3 class="fw-bold mb-4 text-dark" style="font-size: 18px;">자산 구성</h3>

                <div class="d-flex align-items-center gap-5 flex-wrap flex-md-nowrap">
                    <div class="chart-wrap">
                        <canvas id="pieChart"></canvas>
                        <div class="chart-center">
                            <div style="font-size: 12px; color: #8b95a1; font-weight: 500;">보유</div>
                            <div class="fw-bold text-dark" style="font-size: 16px;"
                                 th:text="${#lists.size(portfolio.myStocks)} + '개'"></div>
                        </div>
                    </div>

                    <div class="flex-grow-1 w-100">
                        <div class="weight-bar-wrap" id="weightBar"></div>
                        <div class="d-flex flex-column gap-2">
                            <th:block th:each="stock, stat : ${portfolio.myStocks}">
                                <div class="d-flex align-items-center justify-content-between p-2 rounded-2" onmouseover="this.style.backgroundColor='#f9fafb'" onmouseout="this.style.backgroundColor='transparent'">
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="legend-dot" th:attr="data-idx=${stat.index}"></div>
                                        <span class="fw-bold text-dark" style="font-size: 14px;"
                                              th:text="${stock.korName}"></span>
                                    </div>
                                    <div class="text-end">
                                        <span class="fw-bold" style="font-size: 14px; color: #4e5968;"
                                              th:text="${#numbers.formatDecimal(stock.getCurrentValueKrw(), 0, 'COMMA', 0, 'POINT')} + '원'"></span>
                                        <span class="ms-2 profit-badge"
                                              th:classappend="${stock.profitRate >= 0 ? 'badge-profit' : 'badge-loss'}"
                                              th:text="${(stock.profitRate >= 0 ? '+' : '') + stock.profitRate + '%'}"></span>
                                    </div>
                                </div>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>

            <div class="toss-card fu d3">
                <h3 class="fw-bold mb-4 text-dark" style="font-size: 18px;">보유 종목 상세</h3>

                <th:block th:each="stock : ${portfolio.myStocks}">
                    <div class="stock-row">
                        <div class="stock-icon"
                             th:text="${#strings.substring(stock.korName, 0, 1)}"></div>
                        <div class="flex-grow-1">
                            <div class="stock-name" th:text="${stock.korName}"></div>
                            <div class="stock-meta">
                                <span th:text="${#numbers.formatDecimal(stock.quantity, 0, 'COMMA', 0, 'POINT')} + '주'"></span>
                                <span class="mx-1" style="color: #d1d6db;">|</span>
                                <span>평균
                                    <span th:text="${stock.currency.toString() == 'USD' ? '$' : ''}
                                                 + ${#numbers.formatDecimal(stock.purchasePrice, 0, 'COMMA', (stock.currency.toString() == 'USD' ? 2 : 0), 'POINT')}
                                                 + ${stock.currency.toString() == 'KRW' ? '원' : ''}"></span>
                                </span>
                            </div>
                        </div>
                        <div class="text-end flex-shrink-0" style="min-width:130px;">
                            <div class="stock-value"
                                 th:text="${#numbers.formatDecimal(stock.getCurrentValueKrw(), 0, 'COMMA', 0, 'POINT')} + '원'"></div>
                            <div class="mt-1">
                                <span class="profit-badge"
                                      th:classappend="${stock.profitRate >= 0 ? 'badge-profit' : 'badge-loss'}"
                                      th:text="${(stock.profitRate >= 0 ? '+' : '') + stock.profitRate + '%'}"></span>
                                <span style="font-size: 12px; color: #8b95a1; font-weight: 500; margin-left: 4px;"
                                      th:text="'(' + #numbers.formatDecimal(stock.profit, 0, 'COMMA', 0, 'POINT') + '원)'"></span>
                            </div>
                        </div>
                    </div>
                </th:block>

                <div th:if="${#lists.isEmpty(portfolio.myStocks)}" class="empty-state">
                    <div style="font-size: 14px; font-weight: 500;">현재 보유 중인 종목이 없어요</div>
                </div>
            </div>

        </div>
    </main>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const COLORS = ['#3182F6','#F04452','#05c072','#FFCC00','#4ECDC4','#A78BFA','#F69931','#FF6B6B','#34D399'];
    const stockNames  = [];
    const stockValues = [];
    /*[# th:each="stock : ${portfolio.myStocks}"]*/
    stockNames.push(/*[[${stock.korName}]]*/ '');
    stockValues.push(/*[[${stock.getCurrentValueKrw()}]]*/ 0);
    /*[/]*/
    /*]]>*/

    document.addEventListener('DOMContentLoaded', () => {
        if (!stockValues.length) return;
        const total = stockValues.reduce((a, b) => a + b, 0);

        const ctx = document.getElementById('pieChart')?.getContext('2d');
        if (ctx) {
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: stockNames,
                    datasets: [{
                        data: stockValues,
                        backgroundColor: COLORS.slice(0, stockValues.length),
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    cutout: '75%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: c => ` ${c.label}: ${new Intl.NumberFormat('ko-KR').format(c.raw)}원 (${(c.raw / total * 100).toFixed(1)}%)`
                            }
                        }
                    },
                    animation: { animateRotate: true, duration: 600 }
                }
            });
        }

        const bar = document.getElementById('weightBar');
        if (bar) {
            stockValues.forEach((v, i) => {
                const seg = document.createElement('div');
                seg.className = 'weight-bar-seg';
                seg.style.width  = (v / total * 100).toFixed(2) + '%';
                seg.style.background = COLORS[i % COLORS.length];
                bar.appendChild(seg);
            });
        }

        document.querySelectorAll('.legend-dot[data-idx]').forEach(dot => {
            const i = parseInt(dot.getAttribute('data-idx'));
            dot.style.background = COLORS[i % COLORS.length];
        });
    });
</script>
</body>
</html>
