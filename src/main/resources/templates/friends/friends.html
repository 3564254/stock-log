<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLog - 친구</title>

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        :root {
            --toss-blue: #3182f6; --toss-red: #f04452; --toss-green: #05c072;
            --toss-gray-bg: #f2f4f6; --sidebar-width: 250px;
        }
        body { background-color: var(--toss-gray-bg); font-family: 'Pretendard', sans-serif; overflow-x: hidden; margin: 0; color: #191f28; }
        [x-cloak] { display: none !important; }

        .layout-wrapper { display: flex; min-height: 100vh; }
        .main-content { flex-grow: 1; margin-left: var(--sidebar-width); padding: 0 60px 60px 60px; transition: 0.3s; }
        .main-content.expanded { margin-left: 80px; }
        .content-container { width: 100%; max-width: 900px; margin: 0 auto; padding-top: 32px; }

        .toss-card { background: white; border-radius: 16px; padding: 28px; box-shadow: none; border: 1px solid #e5e8eb; margin-bottom: 24px; }

        .btn-add { background: #f2f4f6; color: #4e5968; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; transition: 0.15s; font-size: 14px; }
        .btn-add:hover { background: #e5e8eb; color: var(--toss-blue); }

        .friend-row { display: flex; align-items: center; padding: 16px 20px; border-radius: 12px; transition: background 0.15s; cursor: pointer; text-decoration: none !important; color: inherit; border: 1px solid transparent; }
        .friend-row:hover { background-color: #f9fafb; border-color: #e5e8eb; }

        .modal-backdrop-custom { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-sheet { background: white; width: 100%; max-width: 480px; border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .toss-input { width: 100%; border: 1px solid #e5e8eb; background: #f9fafb; border-radius: 8px; padding: 14px 16px; outline: none; transition: 0.15s; font-weight: 500; font-size: 15px; }
        .toss-input:focus { border-color: var(--toss-blue); background: white; }

        .text-up { color: var(--toss-red) !important; }
        .text-down { color: var(--toss-blue) !important; }

        .btn-delete-friend { background: none; border: none; color: #b0b8c1; padding: 8px; border-radius: 8px; transition: 0.15s; display: flex; align-items: center; justify-content: center; }
        .btn-delete-friend:hover { background-color: rgba(240, 68, 82, 0.08); color: var(--toss-red); }

        @media (max-width: 768px) {
            .sidebar-main { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 16px !important; }
            .toss-card { padding: 20px !important; }
            .modal-sheet { padding: 24px !important; }

            .friend-row { flex-direction: column; align-items: flex-start; position: relative; padding: 16px; }
            .btn-delete-friend { position: absolute; right: 12px; top: 16px; }
            .friend-row .position-relative { margin-bottom: 12px; }
        }
    </style>
</head>
<body x-data="friendsApp">

<div class="layout-wrapper">
    <aside th:replace="~{fragments/sidebar :: sidebarFragment('friends')}"></aside>

    <main class="main-content" :class="!sidebarOpen ? 'expanded' : ''">
        <div th:replace="~{fragments/header :: headerFragment}"></div>

        <div th:if="${successMessage}" class="alert alert-success border-0 rounded-3 fw-bold shadow-sm mx-auto mt-3" style="max-width: 900px;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 fw-bold shadow-sm mx-auto mt-3" style="max-width: 900px;" th:text="${errorMessage}"></div>

        <div class="content-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0 text-dark" style="font-size: 24px;">내 친구 <span class="text-secondary fs-5 ms-1 fw-bold opacity-50" th:text="${friendCount}">0</span></h2>
                <button @click="openSearchModal()" class="btn-add">친구 추가</button>
            </div>

            <section class="toss-card d-flex align-items-center mb-4 p-4">
                <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white me-4 flex-shrink-0"
                     style="width: 56px; height: 56px; background-color: var(--toss-blue); font-size: 20px;">
                    나
                </div>
                <div class="flex-grow-1">
                    <div class="fw-bold text-dark" style="font-size: 18px;" th:text="${me != null ? '내 프로필 (' + me.username + ')' : '내 프로필 (사용자)'}">나</div>
                </div>
                <a th:href="@{/auth/info}" class="btn border-0 fw-bold" style="background: #f2f4f6; color: #4e5968; border-radius: 8px; padding: 8px 20px; font-size: 14px;">설정</a>
            </section>

            <section th:if="${pendingRequests != null and !#lists.isEmpty(pendingRequests)}" class="toss-card p-4 mb-4" style="background-color: #f9fafb; box-shadow: none;">
                <h3 class="fw-bold mb-3 text-dark" style="font-size: 16px;">나에게 온 친구 요청</h3>

                <div class="d-flex flex-column gap-2">
                    <div th:each="req : ${pendingRequests}" class="d-flex align-items-center justify-content-between p-3 rounded-3 bg-white border" style="border-color: #e5e8eb !important;">
                        <div class="d-flex align-items-center ms-2">
                            <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold me-3 text-white"
                                 style="width: 44px; height: 44px; background-color: #8b95a1; font-size: 16px;"
                                 th:text="${req.requesterName != null && !req.requesterName.isEmpty() ? #strings.substring(req.requesterName, 0, 1) : 'U'}">
                            </div>
                            <div class="fw-bold text-dark" style="font-size: 15px;" th:text="${req.requesterName != null ? req.requesterName : '알 수 없는 사용자'}">요청자</div>
                        </div>

                        <div class="d-flex gap-2 me-2">
                            <form th:action="@{/friends/accept}" method="post" class="m-0">
                                <input type="hidden" name="friendshipId" th:value="${req.friendshipId}">
                                <button type="submit" class="btn btn-sm border-0 fw-bold" style="background: var(--toss-blue); color: white; border-radius: 6px; padding: 6px 16px;">수락</button>
                            </form>
                            <form th:action="@{/friends/reject}" method="post" class="m-0">
                                <input type="hidden" name="friendshipId" th:value="${req.friendshipId}">
                                <button type="submit" class="btn btn-sm border-0 fw-bold" style="background: #f2f4f6; color: #4e5968; border-radius: 6px; padding: 6px 16px;">거절</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>

            <section class="toss-card p-4">
                <div class="d-flex flex-column gap-2">
                    <a th:each="friend : ${friends}" th:href="@{/friends/{id}(id=${friend.id})}" class="friend-row">
                        <div class="position-relative me-4">
                            <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold flex-shrink-0 text-white"
                                 style="width: 48px; height: 48px; background-color: #8b95a1; font-size: 18px;"
                                 th:text="${friend.username != null && !friend.username.isEmpty() ? #strings.substring(friend.username, 0, 1) : 'F'}">
                                F
                            </div>
                        </div>
                        <div class="flex-grow-1">
                            <div class="fw-bold mb-1 text-dark" style="font-size: 16px;" th:text="${friend.username}">이름</div>
                            <div style="font-size: 13px; color: #8b95a1; font-weight: 500;">
                                포트폴리오 보기 <i class="bi bi-chevron-right" style="font-size: 10px;"></i>
                            </div>
                        </div>

                        <div class="d-flex align-items-center" @click.prevent.stop>
                            <form th:action="@{/friends/reject}" method="post" class="m-0" onsubmit="return confirm('친구 목록에서 삭제할까요?');">
                                <input type="hidden" name="friendshipId" th:value="${friend.friendshipId}">
                                <button type="submit" class="btn-delete-friend" title="친구 삭제">
                                    <i class="bi bi-trash3 fs-5"></i>
                                </button>
                            </form>
                        </div>
                    </a>

                    <div th:if="${#lists.isEmpty(friends)}" class="text-center py-5">
                        <div style="font-size: 14px; font-weight: 500; color: #8b95a1; line-height: 1.6;">
                            아직 등록된 친구가 없어요.<br>친구를 추가하고 서로의 투자 현황을 비교해 보세요.
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div x-show="showSearchModal" x-cloak class="modal-backdrop-custom" @click.self="closeSearchModal()">
        <div class="modal-sheet" @click.stop>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0 text-dark" style="font-size: 18px;">친구 추가</h4>
                <button @click="closeSearchModal()" class="btn-close shadow-none"></button>
            </div>

            <div class="mb-4">
                <label class="fw-bold mb-2 d-block" style="font-size: 13px; color: #4e5968;">아이디로 검색하기</label>
                <div class="d-flex gap-2">
                    <input type="text" x-model="searchQuery" @keyup.enter="searchFriend()" class="toss-input flex-grow-1 mb-0" placeholder="친구의 아이디를 입력해 주세요" autofocus>
                    <button @click="searchFriend()" class="btn fw-bold px-4 mb-0" style="background: #f2f4f6; color: #4e5968; border: none; border-radius: 8px; min-width: 80px;" :disabled="isSearching">
                        <span x-show="!isSearching">검색</span>
                        <span x-show="isSearching" class="spinner-border spinner-border-sm"></span>
                    </button>
                </div>
            </div>

            <div style="min-height: 120px;">
                <div x-show="!searchResult && !searchError && !isSearching" class="text-center py-5 rounded-3" style="background: #f9fafb; border: 1px dashed #e5e8eb;">
                    <p class="m-0" style="font-size: 13px; font-weight: 500; color: #8b95a1;">함께 투자할 친구를 찾아보세요</p>
                </div>

                <div x-show="searchError && !isSearching" class="text-center py-5 rounded-3" style="background: #fff4f4; color: #d63a48; font-size: 14px; font-weight: 500;" x-text="searchError"></div>

                <div x-show="searchResult && searchResult.username && !isSearching" class="p-3 rounded-3 border d-flex align-items-center justify-content-between" style="background: white; border-color: #e5e8eb !important;">
                    <div class="d-flex align-items-center gap-3">
                        <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white flex-shrink-0"
                             style="width: 48px; height: 48px; background-color: #8b95a1; font-size: 18px;"
                             x-text="(searchResult?.username || 'U').charAt(0).toUpperCase()">
                        </div>
                        <div class="text-start">
                            <div class="fw-bold text-dark mb-1" style="font-size: 16px;" x-text="searchResult?.username"></div>
                            <div style="font-size: 13px; color: #8b95a1; font-weight: 500;" x-text="'아이디: ' + (searchResult?.loginId || '')"></div>
                        </div>
                    </div>

                    <button @click="sendFriendRequest()" class="btn border-0 fw-bold" style="background: var(--toss-blue); color: white; border-radius: 8px; padding: 10px 16px; font-size: 14px;" :disabled="isSending">
                        <span x-show="!isSending">친구 요청</span>
                        <span x-show="isSending" class="spinner-border spinner-border-sm"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('alpine:init', () => {
        Alpine.data('friendsApp', () => ({
            sidebarOpen: true,
            showSearchModal: false,
            myLoginId: /*[[${loginMember != null ? loginMember.loginId : ''}]]*/ '',

            searchQuery: '', isSearching: false, searchResult: null, searchError: '', isSending: false,

            openSearchModal() { this.showSearchModal = true; this.resetSearch(); },
            closeSearchModal() { this.showSearchModal = false; this.resetSearch(); },

            resetSearch() { this.searchQuery = ''; this.searchResult = null; this.searchError = ''; this.isSearching = false; this.isSending = false; },

            async searchFriend() {
                if (!this.searchQuery.trim()) return;

                if (this.searchQuery === this.myLoginId) {
                    this.searchError = '자기 자신은 검색할 수 없어요';
                    this.searchResult = null;
                    return;
                }

                this.isSearching = true; this.searchResult = null; this.searchError = '';

                try {
                    const response = await fetch(`/friends/search?loginId=${encodeURIComponent(this.searchQuery)}`);

                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.username) {
                            this.searchResult = data;
                        } else {
                            this.searchError = '해당 아이디를 찾을 수 없어요';
                            this.searchResult = null;
                        }
                    } else {
                        const errorText = await response.text();
                        this.searchError = errorText || '사용자 검색을 실패했어요';
                    }
                } catch (e) { this.searchError = '검색 중 오류가 발생했어요'; }
                finally { this.isSearching = false; }
            },

            async sendFriendRequest() {
                this.isSending = true; this.searchError = '';

                try {
                    const formData = new FormData();
                    formData.append('keyword', this.searchQuery);

                    const response = await fetch('/friends/add', {
                        method: 'POST', body: formData
                    });

                    if (response.ok) {
                        window.location.reload();
                    } else {
                        const errorText = await response.text();
                        this.searchError = errorText;
                        this.searchResult = null;
                    }
                } catch (e) { this.searchError = '요청 중 오류가 발생했어요'; }
                finally { this.isSending = false; }
            }
        }));
    });
</script>
</body>
</html>
