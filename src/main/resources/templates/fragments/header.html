<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="headerFragment">
    <style>
        .header-pill {
            background: white; border: 1px solid #e5e8eb; padding: 6px 16px 6px 8px; border-radius: 50px;
            display: flex; align-items: center; gap: 8px; position: relative; cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .header-pill:hover { background-color: #f9fafb; }
        .profile-dropdown {
            position: absolute; top: 56px; right: 0; width: 140px; z-index: 1050;
            background: white; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 1px solid #e5e8eb; overflow: hidden; padding: 8px;
        }
        .dropdown-btn {
            width: 100%; text-align: left; padding: 12px 16px; font-weight: 600;
            border: none; background: transparent; transition: background-color 0.15s ease;
            font-size: 14px; border-radius: 8px;
        }
        .dropdown-btn:hover { background-color: #f2f4f6; }
        .logout-btn { color: var(--toss-red, #f04452); }
        .logout-btn:hover { background-color: #fff4f4; }
    </style>

    <header class="d-flex justify-content-end align-items-center mb-4 pt-3">
        <div class="d-flex align-items-center gap-3">
            <div th:if="${loginMember != null}" class="header-pill" x-data="{ open: false }" @click.away="open = false">
                <div class="d-flex align-items-center gap-2" @click="open = !open" style="cursor: pointer;">
                    <div class="rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; background-color: #f2f4f6;">
                        <i class="bi bi-person-fill text-secondary"></i>
                    </div>
                    <span class="fw-bold text-dark" style="font-size: 14px;" th:text="${loginMember.username}">사용자</span>
                    <i class="bi bi-chevron-down text-secondary ms-1" style="font-size: 12px;"></i>
                </div>

                <div x-show="open" x-transition.opacity x-cloak class="profile-dropdown" style="position: absolute; right: 0; margin-top: 8px;">
                    <a th:href="@{/auth/info}" class="dropdown-btn d-block text-decoration-none" style="color: #4e5968;">
                        내 정보
                    </a>
                    <form th:action="@{/auth/logout}" method="post" class="m-0 mt-1">
                        <button type="submit" class="dropdown-btn logout-btn">
                            로그아웃
                        </button>
                    </form>
                </div>
            </div>

            <div th:if="${loginMember == null}">
                <a th:href="@{/auth/login}" class="btn border-0 fw-bold" style="background: var(--toss-blue, #3182f6); color: white; border-radius: 8px; padding: 10px 24px; font-size: 14px;">로그인</a>
            </div>
        </div>
    </header>
</div>
</html>
