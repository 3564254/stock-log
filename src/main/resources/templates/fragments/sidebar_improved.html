<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebarFragment(activeMenu)" class="sidebar-main">
    <style>
        /* ── Design Tokens ── */
        .sidebar-main {
            --sidebar-bg: #ffffff;
            --sidebar-border: #f2f4f6;
            --sidebar-text: #4e5968;
            --sidebar-text-hover: #191f28;
            --sidebar-active-bg: rgba(49, 130, 246, 0.08);
            --sidebar-active-text: #3182f6;
            --sidebar-hover-bg: #f7f8fa;
            --sidebar-radius: 14px;
            --sidebar-item-gap: 2px;
            --sidebar-logo-padding: 28px 24px 20px;
        }

        .sidebar-main {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ── Logo ── */
        .sidebar-logo {
            padding: var(--sidebar-logo-padding);
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #191f28;
            transition: opacity 0.2s ease;
            flex-shrink: 0;
        }
        .sidebar-logo:hover { opacity: 0.85; }

        .sidebar-logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #3182f6 0%, #1b64da 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            box-shadow: 0 2px 8px rgba(49, 130, 246, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .sidebar-logo:hover .sidebar-logo-icon {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(49, 130, 246, 0.35);
        }
        .sidebar-logo-icon i { color: #fff; font-size: 1rem; }

        .sidebar-logo-text {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            color: #191f28;
        }

        /* ── Menu Section ── */
        .sidebar-nav {
            flex: 1;
            padding: 4px 0;
        }

        .sidebar-section-label {
            padding: 20px 24px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #adb5bd;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* ── Menu Item ── */
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            color: var(--sidebar-text) !important;
            text-decoration: none !important;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--sidebar-radius);
            margin: var(--sidebar-item-gap) 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .menu-item:hover {
            background-color: var(--sidebar-hover-bg);
            color: var(--sidebar-text-hover) !important;
            transform: translateX(2px);
        }

        /* Active state */
        .menu-item.active {
            background-color: var(--sidebar-active-bg);
            color: var(--sidebar-active-text) !important;
            font-weight: 700;
        }
        .menu-item.active::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: var(--sidebar-active-text);
            border-radius: 0 3px 3px 0;
        }

        .menu-item i {
            font-size: 1.2rem;
            margin-right: 12px;
            width: 22px;
            text-align: center;
            transition: transform 0.2s ease;
        }
        .menu-item:hover i {
            transform: scale(1.1);
        }

        .nav-text { display: block; }

        /* ── Bottom Section ── */
        .sidebar-bottom {
            padding: 16px;
            border-top: 1px solid var(--sidebar-border);
            flex-shrink: 0;
        }
        .sidebar-version {
            text-align: center;
            font-size: 0.7rem;
            color: #adb5bd;
            font-weight: 500;
        }

        /* ── Scrollbar ── */
        .sidebar-main::-webkit-scrollbar { width: 4px; }
        .sidebar-main::-webkit-scrollbar-track { background: transparent; }
        .sidebar-main::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 4px; }
        .sidebar-main::-webkit-scrollbar-thumb:hover { background: #ccc; }
    </style>

    <a th:href="@{/}" class="sidebar-logo">
        <div class="sidebar-logo-icon">
            <i class="bi bi-bar-chart-fill"></i>
        </div>
        <span class="sidebar-logo-text">StockLog</span>
    </a>

    <nav class="sidebar-nav">
        <div class="sidebar-section-label">메뉴</div>

        <a th:href="@{/}" class="menu-item" th:classappend="${activeMenu == 'home'} ? 'active' : ''">
            <i class="bi" th:classappend="${activeMenu == 'home'} ? 'bi-house-door-fill' : 'bi-house-door'"></i>
            <span class="nav-text">홈</span>
        </a>

        <a th:href="@{/market}" class="menu-item" th:classappend="${activeMenu == 'market'} ? 'active' : ''">
            <i class="bi" th:classappend="${activeMenu == 'market'} ? 'bi-graph-up-arrow' : 'bi-graph-up'"></i>
            <span class="nav-text">시장 대시보드</span>
        </a>

        <a th:href="@{/portfolio}" class="menu-item" th:classappend="${activeMenu == 'portfolio'} ? 'active' : ''">
            <i class="bi" th:classappend="${activeMenu == 'portfolio'} ? 'bi-pie-chart-fill' : 'bi-pie-chart'"></i>
            <span class="nav-text">내 자산</span>
        </a>

        <a th:href="@{/trade}" class="menu-item" th:classappend="${activeMenu == 'tradelog'} ? 'active' : ''">
            <i class="bi" th:classappend="${activeMenu == 'tradelog'} ? 'bi-journal-text' : 'bi-journal'"></i>
            <span class="nav-text">매매 기록</span>
        </a>

        <div class="sidebar-section-label">소셜</div>

        <a th:href="@{/news}" class="menu-item" th:classappend="${activeMenu == 'news'} ? 'active' : ''">
            <i class="bi" th:classappend="${activeMenu == 'news'} ? 'bi-globe2' : 'bi-globe'"></i>
            <span class="nav-text">시황·뉴스</span>
        </a>

        <a th:href="@{/community}" class="menu-item" th:classappend="${activeMenu == 'community'} ? 'active' : ''">
            <i class="bi" th:classappend="${activeMenu == 'community'} ? 'bi-chat-dots-fill' : 'bi-chat-dots'"></i>
            <span class="nav-text">커뮤니티</span>
        </a>

        <a th:href="@{/friends}" class="menu-item" th:classappend="${activeMenu == 'friends'} ? 'active' : ''">
            <i class="bi" th:classappend="${activeMenu == 'friends'} ? 'bi-people-fill' : 'bi-people'"></i>
            <span class="nav-text">친구</span>
        </a>
    </nav>

    <div class="sidebar-bottom">
        <div class="sidebar-version">StockLog v1.0</div>
    </div>
</aside>
</html>
