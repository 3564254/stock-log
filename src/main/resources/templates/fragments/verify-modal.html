<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 매수·매도 검증 모달 (홈·포트폴리오 공용) -->
<div th:fragment="verifyModal" class="vm-root" x-data="verifyModal"
     @open-verify.window="openWith($event.detail)"
     @keydown.escape.window="open && close()">
<style>
    .vm-root {
        display: contents;
        --vm-blue: var(--toss-blue); --vm-blue-deep: var(--toss-blue-deep);
        --vm-ink: var(--ink); --vm-body: var(--ink-body); --vm-sub: var(--slate); --vm-muted: var(--label-text);
        --vm-line-soft: var(--canvas); --vm-surface: var(--surface-soft);
        --vm-good: var(--status-green); --vm-good-text: var(--status-green-text); --vm-good-tint: var(--status-green-tint);
        --vm-caution-text: var(--caution-text);
        /* 서버가 만든 리포트 HTML(generateVerdict)이 참조하는 변수 */
        --text-dark: var(--ink); --text-secondary: var(--slate); --toss-orange: var(--caution-amber);
    }
    .vm-backdrop { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 16px;
                   background: var(--scrim); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .vm-sheet { background: #fff; width: 100%; max-width: 480px; max-height: 90vh; max-height: 90dvh; border-radius: 24px;
                display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.16);
                font-family: 'Pretendard', sans-serif; letter-spacing: -0.01em; color: var(--vm-ink); outline: none;
                animation: vmIn .2s cubic-bezier(.2,.8,.2,1); }
    @keyframes vmIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* 머리: 종목명 + 검증 종류. 구분선 없이 */
    .vm-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 24px 4px; }
    .vm-stock { font-size: 13px; font-weight: 600; color: var(--vm-muted); word-break: keep-all; }
    .vm-title { font-size: 15px; font-weight: 700; margin: 2px 0 0; color: var(--vm-sub); }
    .vm-close { width: 36px; height: 36px; flex-shrink: 0; border: 0; border-radius: 999px; background: var(--vm-line-soft); color: var(--vm-sub);
                display: inline-flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; transition: background-color .15s ease; }
    .vm-close:hover { background: var(--canvas-hover); color: var(--vm-ink); }
    .vm-body { overflow-y: auto; padding: 12px 24px 24px; }

    /* 결론 한 줄: 가장 크게 */
    .vm-hero { margin: 4px 0 18px; }
    .vm-hero-title { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; color: var(--vm-ink); word-break: keep-all; margin: 0; }
    .vm-hero-title .ok { color: var(--vm-good-text); }
    .vm-hero-sub { font-size: 14px; font-weight: 500; color: var(--vm-sub); margin-top: 6px; line-height: 1.55; word-break: keep-all; }
    .vm-todo { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--toss-blue-tint, #e8f3ff); text-align: left; }
    .vm-todo.s-caution { background: var(--caution-tint); } .vm-todo.s-sell { background: var(--alert-tint); }
    .vm-todo-k { flex: none; font-size: 11px; font-weight: 800; color: #fff; background: var(--toss-blue, #3182f6); border-radius: 6px; padding: 2px 6px; margin-top: 2px; }
    .vm-todo.s-caution .vm-todo-k { background: var(--caution-text); } .vm-todo.s-sell .vm-todo-k { background: var(--alert-text); }
    .vm-todo-t { font-size: 14px; font-weight: 800; color: var(--text-strong); line-height: 1.45; word-break: keep-all; }
    .vm-todo-d { font-size: 12.5px; font-weight: 500; color: var(--text-sub); line-height: 1.5; margin-top: 2px; word-break: keep-all; }
    .vm-hero-wait { display: inline-flex; align-items: center; gap: 8px; }

    .vm-section-k { font-size: 13px; font-weight: 600; color: var(--vm-muted); margin: 0 0 8px; }
    .vm-block { margin-bottom: 20px; }

    /* 규칙 목록: 랜딩 데모와 같은 모양 (확인 중 → / –) */
    .vm-rules { background: var(--vm-surface); border-radius: 16px; padding: 4px 0; }
    .vm-rule { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .vm-rule + .vm-rule { border-top: 1px solid var(--vm-line-soft); }
    .vm-rule-text { flex: 1; min-width: 0; }
    .vm-rule-title { font-size: 14px; font-weight: 700; color: var(--vm-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vm-rule-meta { font-size: 13px; font-weight: 500; color: var(--vm-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .vm-mark { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px;
               transition: background-color .2s ease, color .2s ease, transform .2s ease; }
    .vm-rule.ok .vm-mark { background: var(--vm-good-tint); color: var(--vm-good-text); animation: vmPop .24s ease-out; }
    .vm-rule.no .vm-mark { background: var(--vm-line-soft); color: var(--mist); animation: vmPop .24s ease-out; }
    .vm-rule.no .vm-rule-title { color: var(--vm-sub); }
    .vm-rule.pending .vm-mark { border: 2px solid var(--hairline); border-top-color: var(--vm-blue); animation: vmSpin .7s linear infinite; }
    .vm-rule.pending .vm-mark i { display: none; }
    @keyframes vmPop { 0% { transform: scale(.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes vmSpin { to { transform: rotate(360deg); } }
    .vm-rule .skeleton { border-radius: 6px; }

    .vm-empty { background: var(--vm-surface); border-radius: 16px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .vm-empty-text { font-size: 14px; font-weight: 500; color: var(--vm-sub); word-break: keep-all; }

    /* 차트 신호: 한 줄 */
    .vm-signal { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--vm-surface); border-radius: 16px; padding: 14px 16px; }
    .vm-signal-label { font-size: 15px; font-weight: 700; color: var(--vm-ink); }
    .vm-signal-desc { font-size: 13px; font-weight: 500; color: var(--vm-sub); margin-top: 2px; word-break: keep-all; line-height: 1.5; }
    .vm-price { text-align: right; flex-shrink: 0; }
    .vm-price-k { font-size: 12px; font-weight: 600; color: var(--vm-muted); }
    .vm-price-v { font-size: 15px; font-weight: 800; color: var(--vm-ink); font-variant-numeric: tabular-nums; }

    /* AI 리포트: 기본은 몇 줄만, 펼치기 */
    .vm-report { background: var(--vm-surface); border-radius: 16px; padding: 16px 18px; font-size: 14px; font-weight: 500;
                 line-height: 1.7; color: var(--vm-sub); word-break: keep-all; overflow-wrap: break-word; }
    .vm-report-text { max-height: 120px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
    .vm-report-text.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
    .vm-report-text.is-text { white-space: pre-line; }
    .vm-report-more { margin-top: 8px; }

    .vm-foot { font-size: 12px; font-weight: 500; color: var(--vm-muted); line-height: 1.6; word-break: keep-all; margin: 4px 0 16px; }

    /* 버튼: 사이트 공통 알약 (주요 동작 하나만 검정) */
    .vm-actions { display: flex; gap: 8px; }
    .vm-actions > * { flex: 1 1 0; }
    .vm-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 999px; padding: 14px 16px;
              font-family: inherit; font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; transition: background-color .15s ease, transform .1s ease; }
    .vm-btn:active { transform: scale(.97); }
    .vm-btn-solid { background: var(--vm-ink); color: #fff; }
    .vm-btn-solid:hover { background: var(--vm-body); color: #fff; }
    .vm-btn-soft { background: var(--vm-line-soft); color: var(--vm-ink); }
    .vm-btn-soft:hover { background: var(--canvas-hover); color: var(--vm-ink); }
    .vm-link { background: none; border: 0; padding: 0; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--vm-sub); text-decoration: none; cursor: pointer; white-space: nowrap; }
    .vm-link:hover { color: var(--vm-ink); text-decoration: underline; text-underline-offset: 3px; }
    .vm-btn:focus-visible, .vm-close:focus-visible, .vm-link:focus-visible { outline: 2px solid var(--vm-blue); outline-offset: 2px; }

    /* 실패 */
    .vm-center { text-align: center; padding: 20px 0 4px; }
    .vm-state-title { font-size: 18px; font-weight: 700; color: var(--vm-ink); margin-top: 14px; word-break: keep-all; }
    .vm-state-desc { font-size: 14px; font-weight: 500; color: var(--vm-sub); margin-top: 6px; line-height: 1.6; word-break: keep-all; }

    /* 매도 검증: 결론 색 + 가격 사다리 */
    .vm-hero-title.t-alert { color: var(--alert-text); }
    .vm-hero-title.t-caution { color: var(--vm-caution-text); }
    .vm-ladder { position: relative; background: var(--vm-surface); border-radius: 16px; padding: 6px 0; }
    .vm-ladder::before { content: ''; position: absolute; left: 23px; top: 22px; bottom: 22px; width: 2px; background: var(--hairline); }
    .vm-step { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
    .vm-step-dot { width: 16px; height: 16px; flex: none; border-radius: 50%; background: #fff; border: 2px solid var(--mist); position: relative; z-index: 1; }
    .vm-step.is-target .vm-step-dot { border-color: var(--vm-good); }
    .vm-step.is-line .vm-step-dot { border-color: var(--vm-caution-text); }
    .vm-step.is-current { background: #fff; margin: 2px 8px; padding: 10px 8px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .vm-step.is-current .vm-step-dot { background: var(--vm-ink); border-color: var(--vm-ink); }
    .vm-step-text { flex: 1; min-width: 0; }
    .vm-step-k { font-size: 14px; font-weight: 700; color: var(--vm-body); }
    .vm-step.is-current .vm-step-k { color: var(--vm-ink); }
    .vm-step-note { font-size: 12px; font-weight: 500; color: var(--vm-muted); margin-top: 1px; word-break: keep-all; }
    .vm-step-v { text-align: right; flex: none; font-size: 15px; font-weight: 800; color: var(--vm-ink); font-variant-numeric: tabular-nums; }
    .vm-step-d { font-size: 12px; font-weight: 600; color: var(--vm-muted); margin-top: 1px; }
    /* 매도 검증: 3단계 판정 · 판단 근거 · 지금 판다면 */
    .vm-levels { display: flex; gap: 6px; margin: 14px 0 0; }
    .vm-level { flex: 1; text-align: center; font-size: 13px; font-weight: 700; color: var(--mist); background: var(--vm-surface); border-radius: 10px; padding: 7px 0; }
    .vm-level.on.l-hold { background: var(--vm-good-tint); color: var(--vm-good-text); }
    .vm-level.on.l-caution { background: var(--caution-tint); color: var(--vm-caution-text); }
    .vm-level.on.l-sell { background: var(--alert-tint); color: var(--alert-text); }
    .vm-checks { background: var(--vm-surface); border-radius: 16px; padding: 4px 0; }
    .vm-check { display: flex; gap: 12px; padding: 11px 16px; align-items: flex-start; }
    .vm-check + .vm-check { border-top: 1px solid var(--vm-line-soft); }
    .vm-check .vm-mark { margin-top: 1px; }
    .vm-check.ok .vm-mark { background: var(--vm-good-tint); color: var(--vm-good-text); }
    .vm-check.warn .vm-mark { background: var(--caution-tint); color: var(--vm-caution-text); }
    .vm-check.bad .vm-mark { background: var(--alert-tint); color: var(--alert-text); }
    .vm-check.info .vm-mark { background: var(--vm-line-soft); color: var(--vm-sub); }
    .vm-check-t { font-size: 14px; font-weight: 700; color: var(--vm-body); word-break: keep-all; }
    .vm-check-d { font-size: 13px; font-weight: 500; color: var(--vm-muted); margin-top: 2px; line-height: 1.5; word-break: keep-all; }
    .vm-tag { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600; color: var(--vm-muted); background: var(--canvas, #f2f4f6); border-radius: 6px; padding: 2px 7px; }
    .vm-more { margin: 4px 0 8px; }
    .vm-more summary { font-size: 13px; font-weight: 700; color: var(--vm-sub); cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 12px; }
    .vm-more summary::-webkit-details-marker { display: none; }
    .vm-more[open] summary i { transform: rotate(180deg); }
    .vm-ifsell { border-radius: 16px; padding: 14px 16px; background: var(--vm-surface); }
    .vm-ifsell.s-ok { background: var(--vm-good-tint); }
    .vm-ifsell.s-warn { background: var(--caution-tint); }
    .vm-ifsell-t { font-size: 15px; font-weight: 700; color: var(--vm-ink); word-break: keep-all; }
    .vm-ifsell.s-ok .vm-ifsell-t { color: var(--vm-good-text); }
    .vm-ifsell.s-warn .vm-ifsell-t { color: var(--vm-caution-text); }
    .vm-ifsell-d { font-size: 13px; font-weight: 500; color: var(--vm-sub); margin-top: 4px; line-height: 1.6; word-break: keep-all; }
    .vm-fade { animation: vmFade .25s ease-out; }
    @keyframes vmFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
        .vm-sheet, .vm-fade, .vm-rule.ok .vm-mark, .vm-rule.no .vm-mark { animation: none; }
        .vm-rule.pending .vm-mark { animation-duration: 2.4s; }
    }
    @media (max-width: 768px) {
        .vm-backdrop { align-items: flex-end; padding: 0; }
        .vm-close { width: 44px; height: 44px; }
        .vm-sheet { max-width: none; border-radius: 24px 24px 0 0; max-height: 92vh; max-height: 92dvh; padding-bottom: env(safe-area-inset-bottom); }
        .vm-head { padding: 20px 20px 4px; }
        .vm-body { padding: 12px 20px 20px; }
        .vm-hero-title { font-size: 22px; }
    }
</style>

    <div class="vm-backdrop" x-show="open" x-cloak @click.self="close()">
        <div class="vm-sheet" role="dialog" aria-modal="true" aria-labelledby="vm-title" tabindex="-1"
             x-ref="sheet" @keydown.tab="trapFocus($event)">

            <div class="vm-head">
                <div style="min-width: 0;">
                    <div class="vm-stock" x-text="target?.stockName || ''"></div>
                    <h2 class="vm-title" id="vm-title" x-text="type === 'BUY' ? '매수 전 확인' : '매도 전 확인'"></h2>
                </div>
                <button type="button" class="vm-close" @click="close()" aria-label="닫기"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>

            <div class="vm-body">

                <!-- 실패 -->
                <div x-show="error && !loading" class="vm-center" role="alert">
                    <i class="bi bi-exclamation-circle" style="font-size: 44px; color: var(--vm-caution-text);" aria-hidden="true"></i>
                    <div class="vm-state-title">확인을 끝내지 못했어요</div>
                    <div class="vm-state-desc" x-text="error"></div>
                    <div class="vm-actions" style="margin-top: 24px;">
                        <button type="button" class="vm-btn vm-btn-soft" @click="close()">닫기</button>
                        <button type="button" class="vm-btn vm-btn-solid" @click="run()">다시 시도</button>
                    </div>
                </div>

                <!-- 매도 검증: 서버가 아직 고정 문구만 돌려준다 -->
                <template x-if="result && result.placeholder && !loading">
                    <div class="vm-fade">
                        <div class="vm-hero">
                            <p class="vm-hero-title">매도 확인은 아직 준비 중이에요</p>
                            <div class="vm-hero-sub">지금은 분석 결과를 제공하지 않아요. 보유 수익률과 차트를 직접 확인해 판단해 주세요.</div>
                        </div>
                    </div>
                </template>

                <!-- 매도 검증 확인 중 -->
                <div x-show="type === 'SELL' && loading" class="vm-hero" role="status">
                    <p class="vm-hero-title">보유 종목 정보를 확인하고 있어요</p>
                </div>

                <!-- 매도 검증: 결론 한 줄 + 가격 사다리 -->
                <template x-if="result && result.sell && !loading && sellView">
                    <div class="vm-fade">
                        <div class="vm-hero">
                            <p class="vm-hero-title" :class="'t-' + sellView.tone" x-text="sellView.title"></p>
                            <div class="vm-hero-sub" x-text="sellView.sub"></div>
                            <div class="vm-todo" x-show="sellView.todo" :class="'s-' + (sellView.todo?.tone || 'hold')">
                                <span class="vm-todo-k">할 일</span>
                                <div style="min-width: 0;">
                                    <div class="vm-todo-t" x-text="sellView.todo?.t"></div>
                                    <div class="vm-todo-d" x-show="sellView.todo?.d" x-text="sellView.todo?.d"></div>
                                </div>
                            </div>
                            <div class="vm-levels" x-show="sellView.level" role="img" :aria-label="'판정 ' + ({ hold: '유지', caution: '주의', sell: '매도' })[sellView.level]">
                                <span class="vm-level l-hold" :class="{ on: sellView.level === 'hold' }">유지</span>
                                <span class="vm-level l-caution" :class="{ on: sellView.level === 'caution' }">주의</span>
                                <span class="vm-level l-sell" :class="{ on: sellView.level === 'sell' }">매도</span>
                            </div>
                        </div>
                        <div class="vm-block" x-show="sellView.rows.length > 1">
                            <div class="vm-section-k d-flex justify-content-between"><span>가격 위치</span><span style="font-weight: 500;">%는 현재가 대비</span></div>
                            <div class="vm-ladder">
                                <template x-for="r in sellView.rows" :key="r.k">
                                    <div class="vm-step" :class="{ 'is-current': r.current, 'is-line': r.line, 'is-target': r.target }">
                                        <span class="vm-step-dot" aria-hidden="true"></span>
                                        <div class="vm-step-text">
                                            <div class="vm-step-k" x-text="r.k"></div>
                                            <div class="vm-step-note" x-show="r.note" x-text="r.note"></div>
                                            <div class="vm-step-note" x-show="r.note2" x-text="r.note2"></div>
                                        </div>
                                        <div class="vm-step-v">
                                            <div x-text="formatPrice(r.v)"></div>
                                            <div class="vm-step-d" x-show="r.d !== null" x-text="r.d === null ? '' : pct(r.d)"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div class="vm-block" x-show="sellView.notes?.length">
                            <div class="vm-section-k">주의할 점 · 생각해 볼 것</div>
                            <div class="vm-checks">
                                <template x-for="(n, i) in (sellView.notes || [])" :key="i">
                                    <div class="vm-check info">
                                        <span class="vm-mark" aria-hidden="true"><i class="bi bi-lightbulb"></i></span>
                                        <div style="min-width: 0;">
                                            <div class="vm-check-t" x-text="n.t"></div>
                                            <div class="vm-check-d" x-text="n.d"></div>
                                            <div class="vm-tag" x-show="n.tag" x-text="n.tag"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <details class="vm-more">
                            <summary>자세히 보기 <i class="bi bi-chevron-down" aria-hidden="true"></i></summary>
                        <div class="vm-block" x-show="sellView.ifSell">
                            <div class="vm-section-k">지금 판다면</div>
                            <div class="vm-ifsell" :class="sellView.ifSell ? 's-' + sellView.ifSell.s : ''">
                                <div class="vm-ifsell-t" x-text="sellView.ifSell?.t"></div>
                                <div class="vm-ifsell-d" x-text="sellView.ifSell?.d"></div>
                            </div>
                        </div>
                        <div class="vm-block" x-show="sellView.checks.length">
                            <div class="vm-section-k">판단 근거</div>
                            <div class="vm-checks">
                                <template x-for="(c, i) in sellView.checks" :key="i">
                                    <div class="vm-check" :class="c.s">
                                        <span class="vm-mark" aria-hidden="true">
                                            <i class="bi" :class="{ ok: 'bi-check-lg', warn: 'bi-exclamation-lg', bad: 'bi-x-lg', info: 'bi-info-lg' }[c.s]"></i>
                                        </span>
                                        <div style="min-width: 0;">
                                            <div class="vm-check-t" x-text="c.t"></div>
                                            <div class="vm-check-d" x-show="c.d" x-text="c.d"></div>
                                        </div>
                                        <span class="visually-hidden" x-text="({ ok: '양호', warn: '주의', bad: '위험', info: '참고' })[c.s]"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        </details>
                    </div>
                </template>

                <!-- 매수 검증: 확인 중 + 결과를 한 화면에서 (랜딩 데모와 같은 흐름) -->
                <div x-show="((type === 'BUY' && loading) || (result && !result.placeholder && !result.sell)) && !error" aria-live="polite">

                    <!-- 결론 -->
                    <div class="vm-hero">
                        <template x-if="!settled">
                            <div>
                                <p class="vm-hero-title">내 규칙을 확인하고 있어요</p>
                                <div class="vm-hero-sub" role="status"
                                     x-text="slowHint ? 'AI 리포트까지 쓰고 있어서 조금 더 걸려요' : '결과가 나오면 규칙을 하나씩 체크해 드려요'"></div>
                            </div>
                        </template>
                        <template x-if="settled">
                            <div class="vm-fade">
                                <p class="vm-hero-title" x-html="heroTitleHtml"></p>
                                <div class="vm-hero-sub" x-show="ruleSummary.sub" x-text="ruleSummary.sub"></div>
                            </div>
                        </template>
                    </div>

                    <!-- 내 규칙 -->
                    <div class="vm-block">
                        <div class="vm-section-k">내 매매 규칙</div>

                        <!-- 결과가 왔는데 규칙이 없을 때 -->
                        <template x-if="result && details.length === 0">
                            <div class="vm-empty">
                                <span class="vm-empty-text">켜 둔 규칙이 없어서 대조할 게 없어요</span>
                                <button type="button" class="vm-link" @click="createRule()">규칙 만들기 <i class="bi bi-chevron-right" aria-hidden="true"></i></button>
                            </div>
                        </template>

                        <div class="vm-rules" x-show="!(result && details.length === 0)">
                            <!-- 확인 중인데 미리 받은 규칙 목록이 없으면 자리표시 줄 -->
                            <template x-if="ruleRows.length === 0">
                                <div>
                                    <template x-for="n in 3" :key="n">
                                        <div class="vm-rule pending" aria-hidden="true">
                                            <span class="vm-mark"><i class="bi bi-check-lg"></i></span>
                                            <div class="vm-rule-text" style="display: grid; gap: 7px;">
                                                <div class="skeleton" style="height: 12px;" :style="{ width: [62, 48, 56][n - 1] + '%' }"></div>
                                                <div class="skeleton" style="height: 10px; width: 30%;"></div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template x-for="row in ruleRows" :key="row.key">
                                <div class="vm-rule" :class="row.state">
                                    <span class="vm-mark" aria-hidden="true">
                                        <i class="bi" :class="row.state === 'ok' ? 'bi-check-lg' : 'bi-dash-lg'"></i>
                                    </span>
                                    <div class="vm-rule-text">
                                        <div class="vm-rule-title" x-text="row.title"></div>
                                        <div class="vm-rule-meta" x-text="row.meta"></div>
                                    </div>
                                    <span class="visually-hidden" x-text="row.state === 'ok' ? '충족' : row.state === 'no' ? '미충족' : '확인 중'"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 차트 신호 -->
                    <div class="vm-block" x-show="type === 'BUY'">
                        <div class="vm-section-k">차트 진입 신호</div>
                        <template x-if="!settled">
                            <div class="vm-signal" aria-hidden="true">
                                <div style="flex: 1; display: grid; gap: 7px;">
                                    <div class="skeleton" style="height: 13px; width: 30%;"></div>
                                    <div class="skeleton" style="height: 10px; width: 70%;"></div>
                                </div>
                            </div>
                        </template>
                        <template x-if="settled">
                            <div class="vm-signal vm-fade">
                                <div style="min-width: 0;">
                                    <div class="vm-signal-label" x-text="signalMeta.label"></div>
                                    <div class="vm-signal-desc" x-text="signalMeta.desc"></div>
                                </div>
                                <div class="vm-price" x-show="Number(result?.targetPrice) > 0">
                                    <div class="vm-price-k">1차 진입가</div>
                                    <div class="vm-price-v" x-text="formatPrice(result?.targetPrice)"></div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- 이미 손실 중인 보유 종목을 더 사려는 경우 (물타기) -->
                    <div class="vm-block vm-fade" x-show="type === 'BUY' && settled && avgDown">
                        <div class="vm-section-k">이미 보유 중인 종목</div>
                        <div class="vm-ifsell s-warn">
                            <div class="vm-ifsell-t" x-text="avgDown?.t"></div>
                            <div class="vm-ifsell-d" x-text="avgDown?.d"></div>
                        </div>
                    </div>

                    <!-- AI 리포트 -->
                    <div class="vm-block" x-show="!settled || result?.verdictComment">
                        <div class="vm-section-k">AI 분석 리포트</div>
                        <template x-if="!settled">
                            <div class="vm-report" aria-hidden="true" style="display: grid; gap: 9px;">
                                <div class="skeleton" style="height: 11px; width: 92%;"></div>
                                <div class="skeleton" style="height: 11px; width: 84%;"></div>
                                <div class="skeleton" style="height: 11px; width: 58%;"></div>
                            </div>
                        </template>
                        <template x-if="settled && result?.verdictComment">
                            <div class="vm-report vm-fade">
                                <div class="vm-report-text" :class="[reportIsHtml ? '' : 'is-text', reportOpen ? 'open' : '']" x-html="reportHtml"></div>
                                <button type="button" class="vm-link vm-report-more" @click="reportOpen = !reportOpen" :aria-expanded="reportOpen.toString()"
                                        x-text="reportOpen ? '접기' : '리포트 전체 보기'"></button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 다음 행동 -->
                <div x-show="result && settled && !loading" class="vm-fade">
                    <p class="vm-foot">
                        <span x-text="analyzedAt ? analyzedAt + ' 기준 · ' : ''"></span><span x-text="type === 'SELL' ? '차트 지지·저항으로 계산한 참고 정보예요.' : '내 규칙과 차트 지표로 계산한 참고 정보예요.'"></span> 투자 판단과 책임은 본인에게 있어요.
                    </p>

                    <!-- 규칙이 있고 모두 충족했을 때만 '기록'을 앞세운다 -->
                    <template x-if="isRecordFirst">
                        <div class="vm-actions">
                            <button type="button" class="vm-btn vm-btn-soft" @click="close()">닫기</button>
                            <a class="vm-btn vm-btn-solid" :href="recordUrl" x-text="type === 'BUY' ? '보유 종목에 추가' : '매도 기록하기'"></a>
                        </div>
                    </template>
                    <template x-if="!isRecordFirst">
                        <div>
                            <div class="vm-actions">
                                <button type="button" class="vm-btn vm-btn-soft" @click="run()">다시 확인</button>
                                <button type="button" class="vm-btn vm-btn-solid" @click="close()">닫기</button>
                            </div>
                            <div style="text-align: center; margin-top: 14px;" x-show="type === 'BUY'">
                                <a class="vm-link" :href="recordUrl">그래도 매수했다면 보유 종목에 추가해 두세요</a>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

<script th:src="@{/js/hold-judge.js}" src="/js/hold-judge.js"></script>
<script th:inline="none">
    document.addEventListener('alpine:init', () => {
        // IndicatorType enum과 같은 키
        const INDICATOR_SHORT = {
            STOCK_SCORE: '종합 점수', VALUATION_SCORE: '밸류 점수', MOMENTUM_SCORE: '모멘텀 점수', TECHNICAL_SCORE: '기술 점수',
            MA5: '5일선', MA20: '20일선', MA50: '50일선',
            DIST_MA5: '5일선 이격도', DIST_MA20: '20일선 이격도', RSI: 'RSI', ADX: 'ADX', ATR: 'ATR',
            BAND_WIDTH: '볼린저 대역폭', VOLUME: '거래량', UPTREND: '정배열', MACRO_UPTREND: '장기 상승',
            BOLLINGER_SQUEEZE: '볼린저 응축', VOLUME_BULLISH: '거래량 폭발', NEW_HIGH_5D: '단기 고점',
            HIGHER_LOW: '저점 방어', MACD_GOLDEN_CROSS: 'MACD 골든 크로스'
        };
        // signal.trading.Verdict
        const SIGNALS = {
            ACTIONABLE:    { label: '기술적 조건 충족', desc: '진입 구간 안에서 반등이 확인됐고 손익비도 기준을 넘었어요. 백테스트에서 이 판정의 수익 우위는 검증되지 않은 참고 정보예요' },
            WAIT_FOR_ZONE: { label: '눌림 대기',     desc: '현재가가 진입 구간보다 위에 있어요' },
            WAIT_TRIGGER:  { label: '양봉 대기',  desc: '진입 구간 안이지만 오늘은 아직 양봉이 아니에요 (양봉도 반등 확정은 아니에요)' },
            CHASE_RISK:    { label: '추격 구간',     desc: '돌파·탈환 구간을 이미 벗어났어요' },
            RR_TOO_LOW:    { label: '손익비 부족',   desc: '예상 손실에 비해 기대 수익이 작아요' },
            NO_SETUP:      { label: '진입 계획 없음', desc: '지금 차트로는 진입 계획을 세울 수 없어요' },
            BOUNDARY_WATCH: { label: '경계 확인 중', desc: '오늘 가격이 진입 구간 경계를 오르내리고 있어요. 조금 더 지켜본 뒤 판단하세요' }
        };

        const escapeHtml = (s) => String(s ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const looksLikeHtml = (s) => /<\/?(div|b|br|strong|span|p)\b/i.test(s || '');
        // 서버가 만든 리포트 HTML은 허용 태그와 안전한 style만 남긴다
        const ALLOWED_TAGS = new Set(['B', 'STRONG', 'EM', 'I', 'BR', 'DIV', 'SPAN', 'P', 'HR', 'UL', 'OL', 'LI']);
        const sanitizeHtml = (html) => {
            const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
            const root = doc.body.firstElementChild;
            const walk = (node) => {
                [...node.children].forEach(el => {
                    if (!ALLOWED_TAGS.has(el.tagName)) { el.replaceWith(doc.createTextNode(el.textContent)); return; }
                    [...el.attributes].forEach(a => {
                        if (a.name !== 'style' || /url\s*\(|expression|javascript:/i.test(a.value)) el.removeAttribute(a.name);
                    });
                    walk(el);
                });
            };
            walk(root);
            return root.innerHTML;
        };

        Alpine.data('verifyModal', () => ({
            open: false,
            type: 'BUY',
            target: null,
            ruleConditions: {},
            canCreateRule: false,
            loading: false,
            result: null,
            error: '',
            analyzedAt: '',
            token: 0,
            returnFocus: null,
            rulePreview: [],     // 여는 쪽이 넘겨 준 규칙 (확인 중에 미리 보여 줌)
            holding: null,       // 매도 검증용 보유 정보 { averagePrice, currentPrice, highestPriceSinceBuy, entryStop } (여는 쪽이 넘겨 줌)
            revealed: 0,         // 결과가 온 뒤 위에서부터 체크된 줄 수
            revealTimer: null,
            slowTimer: null,
            slowHint: false,
            reportOpen: false,

            get details() { return Array.isArray(this.result?.details) ? this.result.details : []; },
            get sortedDetails() { return [...this.details].sort((a, b) => Number(a.passed) - Number(b.passed)); },
            get passedCount() { return this.details.filter(d => d.passed).length; },
            // 결과가 도착하고 규칙 체크 연출까지 끝났는지
            get settled() { return !this.loading && !!this.result && this.revealed >= this.details.length; },
            // 화면의 규칙 줄: 확인 중에는 미리 받은 목록(전부 확인 중), 결과가 오면 위에서부터 하나씩 / –
            get ruleRows() {
                if (this.result && !this.result.placeholder) {
                    return this.details.map((d, i) => ({
                        key: 'r' + (d.ruleId ?? i), title: d.ruleTitle, meta: this.ruleMeta(d),
                        state: i < this.revealed ? (d.passed ? 'ok' : 'no') : 'pending'
                    }));
                }
                return this.rulePreview.map((r, i) => ({
                    key: 'p' + (r.id ?? i), title: r.title,
                    meta: r.cond ? `기준 ${r.cond}` : '확인 중', state: 'pending'
                }));
            },
            get heroTitleHtml() {
                const total = this.details.length, passed = this.passedCount;
                if (total === 0) return '켜 둔 매매 규칙이 없어요';
                if (passed === total) return `내 규칙 ${total}개를 <span class="ok">모두 충족</span>했어요`;
                return `규칙 ${total}개 중 ${passed}개 충족`;
            },
            get ruleSummary() {
                const total = this.details.length, passed = this.passedCount;
                if (total === 0) {
                    return { title: '켜 둔 매매 규칙이 없어요', sub: '규칙을 만들어 두면 매수 전에 하나씩 대조해 드려요.' };
                }
                if (passed === total) return { title: `내 규칙 ${total}개를 모두 충족했어요`, sub: '' };
                return { title: `내 규칙 ${total}개 중 ${passed}개를 충족했어요`,
                         sub: `${total - passed}개 규칙이 아직 기준에 못 미쳐요.` };
            },
            // 평단보다 낮은 가격에 추가 매수(물타기)하려는지. 여는 쪽이 보유 정보를 넘겼을 때만
            get avgDown() {
                const h = this.holding;
                if (this.type !== 'BUY' || !h) return null;
                const avg = Number(h.averagePrice), cur = Number(h.currentPrice);
                if (!(avg > 0 && cur > 0 && cur < avg)) return null;
                const loss = (cur / avg - 1) * 100;
                const ok = this.result?.signalVerdict === 'ACTIONABLE';
                return ok
                    ? { t: `평단 대비 ${this.pct(loss)} 손실 중에 추가 매수예요`,
                        d: '차트 진입 신호는 있어요. 그래도 평단을 낮추려는 게 아니라 새 진입으로 보고, 새 손절선을 정한 뒤 이 종목 전체 손실이 계좌의 1~2%를 넘지 않게 하세요.' }
                    : { t: `평단 대비 ${this.pct(loss)} 손실 중에 물타기예요`,
                        d: '차트상 지금은 진입 자리가 아니에요. 평단을 낮추려는 추가 매수는 손실을 키우는 경우가 많아요. 기존 손절선을 먼저 지키세요.' };
            },
            get signalMeta() {
                return SIGNALS[this.result?.signalVerdict]
                    || { label: '데이터 부족', desc: '차트 데이터가 부족해 진입 신호를 판단하지 못했어요' };
            },
            get isRecordFirst() {
                if (!this.result) return false;
                if (this.result.sell) return !!this.sellView?.urgent;
                if (this.result.placeholder) return true;
                return this.details.length > 0 && this.passedCount === this.details.length;
            },
            get recordUrl() {
                const code = encodeURIComponent(this.target?.stockCode || '');
                const name = encodeURIComponent(this.target?.stockName || '');
                return this.type === 'BUY'
                    ? `/portfolio?add=holding&code=${code}&name=${name}`
                    : `/trade?code=${code}&name=${name}`;
            },
            get reportIsHtml() { return looksLikeHtml(this.result?.verdictComment); },
            get reportHtml() {
                const text = this.result?.verdictComment;
                if (!text) return '';
                if (looksLikeHtml(text)) return sanitizeHtml(text);
                return escapeHtml(text)
                    .replace(/\[(.*?)\]/g, '<strong style="color:var(--ink);">[$1]</strong>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--ink);">$1</strong>')
                    .replace(/-{5,}/g, '<hr style="border:none; border-top:1px solid var(--hairline); margin:14px 0;">');
            },
            // 서버 결과 한 줄 요약
            get summary() {
                if (this.result?.sell) return this.sellView?.short || '';
                if (!this.result || this.result.placeholder) return '';
                const total = this.details.length, passed = this.passedCount;
                if (total === 0) return '규칙 없음';
                return passed === total ? `규칙 ${total}개 모두 충족` : `규칙 ${passed}/${total} 충족`;
            },

            pct(v) { const n = Number(v) || 0; return (n > 0 ? '+' : '') + n.toFixed(1) + '%'; },

            /* 매도 검증 화면 모델. 기준선(현재가 아래)이 평단 이상이면 '수익 보호선', 아니면 '손절선' */
            get sellView() {
                // 판정 로직은 /js/hold-judge.js
                return window.holdJudge ? window.holdJudge(this.result?.sell, (v) => this.formatPrice(v)) : null;
            },

            /* 매도 검증 데이터: 보유 기준선·목표(/holding-stops) + 평단·현재가 */
            async buildSell(code) {
                // 홈처럼 보유 정보를 넘기지 않고 연 경우: 서버에서 내 보유와 성향을 가져온다
                if (!this.holding || !this.holding.averagePrice) {
                    try {
                        const r = await fetch('/api/portfolio/my-holding?code=' + encodeURIComponent(code), { headers: { 'Accept': 'application/json' } });
                        if (r.ok && !r.redirected) {
                            const body = await r.json();
                            if (body?.setting && !window.__investSetting) window.__investSetting = body.setting;
                            const mh = body?.holding;
                            if (mh && Number(mh.averagePrice) > 0) this.holding = { averagePrice: mh.averagePrice, currentPrice: mh.currentPrice, highestPriceSinceBuy: mh.highestPriceSinceBuy, entryStop: mh.entryStop, holdStyle: mh.holdStyle || null,
                                                                          acctWeight: Number(body.accountWeight) || Number(mh.weight) || null };
                        }
                    } catch (e) { /* 보유 정보 없이도 기준선은 보여 준다 */ }
                }
                const h = this.holding || {};
                let cur = Number(h.currentPrice), avg = Number(h.averagePrice);
                const res = await fetch('/api/portfolio/holding-stops?codes=' + encodeURIComponent(code), { headers: { 'Accept': 'application/json' } });
                if (res.status === 401 || res.status === 403 || (res.redirected && res.url.includes('/auth/login'))) {
                    throw Object.assign(new Error('login'), { login: true });
                }
                let s = null;
                if (res.ok) { const data = await res.json(); s = data?.[code] || null; }
                // 모멘텀 기준 전략 보유: 손절선 대신 순위로 판정
                let mo = null;
                if (h.holdStyle === 'MOMENTUM') {
                    try { const r = await fetch('/api/momentum/' + encodeURIComponent(code), { headers: { 'Accept': 'application/json' } }); if (r.ok && !r.redirected) mo = await r.json(); } catch (e) { /* 순위 없이도 연다 */ }
                }
                if (!(cur > 0)) {
                    try {
                        const p = await (await fetch(`/api/stock/${encodeURIComponent(code)}`, { headers: { 'Accept': 'application/json' } })).json();
                        cur = Number(p?.currentPrice);
                    } catch (e) { /* 현재가 없이도 기준선은 보여 준다 */ }
                }
                return { details: [], sell: {
                    cur: cur > 0 ? cur : 0, avg: avg > 0 ? avg : 0,
                    stop: Number(s?.stop) || 0, basis: s?.basis || '',
                    target: Number(s?.target) || 0, targetBasis: s?.targetBasis || '',
                    atr: Number(s?.atr) || 0, peak: Number(h.highestPriceSinceBuy) || 0, entryStop: Number(h.entryStop) || 0,
                    style: h.holdStyle || null, mo,
                    ma20: Number(s?.ma20) || 0, below20Days: Number(s?.below20Days) || 0,
                    longDown: !!s?.longDown, longMa: Number(s?.longMa) || 0,
                    overheat: !!s?.overheat, rsi: Number(s?.rsi) || 0,
                    dayOpen: Number(s?.dayOpen) || 0, dayLow: Number(s?.dayLow) || 0,
                    lastClose: Number(s?.lastClose) || 0, closeDate: s?.closeDate || null, sessionOpen: !!s?.sessionOpen,
                    prevClose: Number(s?.prevClose) || 0, low20: Number(s?.low20) || 0, acctWeight: Number(h.acctWeight) || 0
                } };
            },

            ruleMeta(d) {
                const name = INDICATOR_SHORT[d.indicatorType] || d.indicatorType || '지표';
                const cond = this.ruleConditions?.[d.ruleId];
                // 수치형 지표는 실제 값도 함께. 값을 못 구했으면 그 사실을 알린다
                const v = Number(d.currentValue);
                const now = d.currentValue == null ? (/_SCORE$/.test(d.indicatorType || '') ? ' 계산 실패' : '')
                          : ' ' + (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('ko-KR') : String(Math.round(v * 100) / 100));
                return cond ? `${name}${now} · 기준 ${cond}` : `${name}${now}`;
            },
            formatPrice(val) {
                const n = Number(val);
                if (!isFinite(n) || n <= 0) return '-';
                const code = this.target?.stockCode || '';
                return /^\d+$/.test(code)
                    ? new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 0 }).format(n) + '원'
                    : '$' + new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
            },

            openWith(detail) {
                if (!detail?.stockCode) return;
                this.type = detail.type === 'SELL' ? 'SELL' : 'BUY';
                this.target = { stockCode: detail.stockCode, stockName: detail.stockName || detail.stockCode };
                this.ruleConditions = detail.ruleConditions || {};
                this.canCreateRule = !!detail.canCreateRule;
                this.rulePreview = Array.isArray(detail.rules) ? detail.rules.filter(r => r && r.title) : [];
                this.holding = detail.holding || null;
                this.returnFocus = document.activeElement;
                this.open = true;
                document.body.style.overflow = 'hidden';
                this.$nextTick(() => this.$refs.sheet?.focus());
                this.run();
            },

            close() {
                this.token++;                 // 진행 중인 요청의 결과는 버린다
                this.stopTimers();
                this.open = false;
                this.loading = false;
                this.result = null;
                this.error = '';
                this.analyzedAt = '';
                document.body.style.overflow = '';
                const el = this.returnFocus;
                this.returnFocus = null;
                if (el && el.isConnected && typeof el.focus === 'function') el.focus();
            },

            stopTimers() {
                clearInterval(this.revealTimer); this.revealTimer = null;
                clearTimeout(this.slowTimer); this.slowTimer = null;
            },
            // 결과는 한 번에 오지만, 규칙 줄은 위에서부터 차례로 체크해 보여 준다
            reveal() {
                clearInterval(this.revealTimer);
                const n = this.details.length;
                const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
                if (n === 0 || reduce) { this.revealed = n; return; }
                this.revealed = 0;
                this.revealTimer = setInterval(() => {
                    this.revealed++;
                    if (this.revealed >= n) { clearInterval(this.revealTimer); this.revealTimer = null; }
                }, 160);
            },

            createRule() {
                if (this.canCreateRule) {
                    this.close();
                    window.dispatchEvent(new CustomEvent('verify-create-rule'));
                } else {
                    window.location.href = '/portfolio?add=rule';
                }
            },

            trapFocus(e) {
                const nodes = [...this.$refs.sheet.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])')]
                    .filter(el => !el.disabled && el.offsetParent !== null);
                if (nodes.length === 0) { e.preventDefault(); return; }
                const first = nodes[0], last = nodes[nodes.length - 1];
                if (e.shiftKey && (document.activeElement === first || document.activeElement === this.$refs.sheet)) {
                    e.preventDefault(); last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault(); first.focus();
                }
            },

            async run() {
                if (this.loading || !this.target?.stockCode) return;
                const token = ++this.token;
                const type = this.type, code = this.target.stockCode;
                this.loading = true;
                this.result = null;
                this.error = '';
                this.revealed = 0;
                this.reportOpen = false;
                this.slowHint = false;
                this.stopTimers();
                this.slowTimer = setTimeout(() => { if (token === this.token) this.slowHint = true; }, 6000);

                if (type === 'SELL') {
                    try {
                        const r = await this.buildSell(code);
                        if (token !== this.token) return;
                        this.result = r;
                        this.analyzedAt = new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
                        window.dispatchEvent(new CustomEvent('verify-done', { detail: {
                            type, stockCode: code, placeholder: false, summary: this.summary,
                            chartPhase: null, targetPrice: null, at: this.analyzedAt
                        } }));
                    } catch (err) {
                        if (token !== this.token) return;
                        this.error = err.login ? '로그인이 만료됐어요. 다시 로그인한 뒤 확인해 주세요.'
                                               : '보유 종목 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
                    } finally {
                        if (token === this.token) { this.loading = false; clearTimeout(this.slowTimer); }
                    }
                    return;
                }

                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 60000);   // 차트 분석 + AI 리포트까지 기다린다
                try {
                    const res = await fetch(type === 'BUY' ? '/api/portfolio/verify/buy' : '/api/portfolio/verify/sell', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ targetId: code }),
                        signal: controller.signal
                    });
                    if (token !== this.token) return;

                    const isJson = (res.headers.get('content-type') || '').includes('application/json');
                    const sentToLogin = res.redirected && res.url.includes('/auth/login');
                    if (res.status === 401 || res.status === 403 || sentToLogin) {
                        this.error = '로그인이 만료됐어요. 다시 로그인한 뒤 검증해 주세요.';
                        return;
                    }
                    if (res.status === 429) {
                        this.error = '검증 요청이 몰려 있어요. 1분쯤 뒤에 다시 시도해 주세요.';
                        return;
                    }
                    if (!res.ok || !isJson) {
                        this.error = '서버가 검증 결과를 만들지 못했어요. 잠시 후 다시 시도해 주세요.';
                        return;
                    }

                    const raw = await res.json();
                    if (token !== this.token) return;
                    if (!raw || typeof raw !== 'object') {
                        this.error = '서버가 검증 결과를 만들지 못했어요. 잠시 후 다시 시도해 주세요.';
                        return;
                    }
                    // decision이 없으면 매도 검증 임시 응답이다
                    this.result = raw.decision ? raw : { placeholder: true, details: [] };
                    this.loading = false;
                    this.reveal();
                    this.analyzedAt = new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());

                    window.dispatchEvent(new CustomEvent('verify-done', { detail: {
                        type, stockCode: code,
                        placeholder: !!this.result.placeholder,
                        summary: this.summary,
                        chartPhase: raw.chartPhase || null,
                        targetPrice: raw.targetPrice ?? null,
                        at: this.analyzedAt
                    } }));
                } catch (err) {
                    if (token !== this.token) return;
                    console.error('검증 통신 오류:', err);
                    this.error = err.name === 'AbortError'
                        ? '검증이 1분 넘게 걸려 중단했어요. 잠시 후 다시 시도해 주세요.'
                        : '서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.';
                } finally {
                    clearTimeout(timer);
                    if (token === this.token) { this.loading = false; clearTimeout(this.slowTimer); }
                }
            }
        }));
    });
</script>
</div>
</html>
