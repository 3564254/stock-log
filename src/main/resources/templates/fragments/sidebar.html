<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  상단 내비게이션 (예전 사이드바 + 헤더를 합친 것). 조각 이름은 기존 화면과의 호환을 위해 sidebarFragment 그대로.
  - 데스크톱: [로고] [메뉴 6개] ........ [프로필 / 로그인]
  - 768px 이하: [로고] ........ [프로필 / 로그인] + 하단 탭바
  - 로그인 전: 메뉴와 하단 탭바를 숨기고 로고와 로그인 버튼만 보여 준다
  - 프로필 메뉴는 <details>로 만들어 Alpine이 없는 화면(오류 화면 등)에서도 동작한다
-->
<div th:fragment="sidebarFragment(activeMenu)" style="display: contents;">
<style>
    .topnav {
        position: sticky; top: 0; z-index: 1000;
        background: rgba(242, 244, 246, 0.86);
        -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px);
        border-bottom: 1px solid var(--hairline);
    }
    .topnav-inner {
        display: flex; align-items: center; gap: 28px; height: var(--topnav-height, 64px);
        max-width: calc(var(--nav-max, 1200px) + 120px);
        margin: 0 auto; padding: 0 60px;
    }
    .topnav-logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); flex-shrink: 0; }
    .topnav-logo:hover { color: var(--ink); opacity: .85; }
    .topnav-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; }
    .topnav-mark i { color: #fff; font-size: 13px; }
    .topnav-name { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; }

    .topnav-menu { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .topnav-menu::-webkit-scrollbar { display: none; }
    .topnav-link {
        padding: 8px 14px; border-radius: var(--radius-pill, 999px); white-space: nowrap;
        font-size: 15px; font-weight: 600; color: var(--slate); text-decoration: none;
        transition: background-color .15s ease, color .15s ease;
    }
    .topnav-link:hover { background: var(--canvas-hover); color: var(--ink); }
    .topnav-link.active { background: var(--paper); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-raised); }

    .topnav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .topnav-login { padding: 10px 18px; }

    /* 프로필 메뉴 */
    .topnav-profile { position: relative; }
    .topnav-profile > summary { list-style: none; }
    .topnav-profile > summary::-webkit-details-marker { display: none; }
    .profile-pill {
        display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: var(--radius-pill, 999px);
        background: var(--paper); cursor: pointer; transition: background-color .15s ease;
    }
    .profile-pill:hover { background: var(--surface-soft); }
    .profile-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--canvas); color: var(--label-text); display: grid; place-items: center; flex-shrink: 0; }
    .profile-name { font-size: 14px; font-weight: 700; color: var(--ink); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile-chevron { font-size: 12px; color: var(--label-text); transition: transform .15s ease; }
    .topnav-profile[open] .profile-chevron { transform: rotate(180deg); }
    .profile-dropdown {
        position: absolute; top: calc(100% + 8px); right: 0; width: 168px; padding: 8px;
        background: var(--paper); border-radius: 14px; box-shadow: var(--shadow-dropdown); border: 1px solid var(--hairline);
    }
    .dropdown-btn {
        display: block; width: 100%; text-align: left; padding: 11px 14px; border: 0; background: transparent; border-radius: 10px;
        font-family: inherit; font-size: 14px; font-weight: 600; color: var(--slate); text-decoration: none; cursor: pointer;
        transition: background-color .15s ease;
    }
    .dropdown-btn:hover, .dropdown-btn:focus-visible { background: var(--canvas); color: var(--ink); outline: none; }
    .logout-btn { color: var(--toss-red-deep); }
    .logout-btn:hover, .logout-btn:focus-visible { background: var(--toss-red-tint); color: var(--toss-red-deep); }

    /* 모바일 하단 탭바 */
    .mobile-tabbar { display: none; }
    @media (max-width: 1100px) { .topnav-inner { padding: 0 28px; } }
    @media (max-width: 768px) {
        .topnav-inner { height: 56px; padding: 0 16px; gap: 12px; }
        .topnav-menu { display: none; }
        .profile-name { max-width: 90px; }
        .topnav-login { padding: 9px 16px; }
        /* 자체 모바일 규칙이 없는 화면도 깨지지 않도록 하는 안전망 */
        .main-content { margin-left: 0 !important; width: 100% !important; min-width: 0; padding-left: 16px !important; padding-right: 16px !important; }
        .mobile-tabbar {
            display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
            background: #fff; border-top: 1px solid var(--hairline); padding-bottom: env(safe-area-inset-bottom);
        }
        .mobile-tab {
            flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; padding: 9px 2px 8px; color: var(--label-text) !important; text-decoration: none !important;
            font-size: 11px; font-weight: 600; white-space: nowrap; letter-spacing: -0.02em; -webkit-tap-highlight-color: transparent;
        }
        .mobile-tab i { font-size: 20px; line-height: 1; }
        .mobile-tab.active { color: var(--ink) !important; font-weight: 700; }
        body:has(.mobile-tabbar) { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    }
</style>

<header class="topnav">
    <div class="topnav-inner">
        <a th:href="@{/}" class="topnav-logo" aria-label="StockLog 홈">
            <span class="topnav-mark" aria-hidden="true"><i class="bi bi-bar-chart-fill"></i></span>
            <span class="topnav-name">StockLog</span>
        </a>

        <nav class="topnav-menu" th:if="${loginMember != null}" aria-label="주 메뉴">
            <a th:href="@{/}" class="topnav-link" th:classappend="${activeMenu == 'home'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'home'} ? 'page' : null">홈</a>
            <a th:href="@{/market}" class="topnav-link" th:classappend="${activeMenu == 'market'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'market'} ? 'page' : null">시장</a>
            <a th:href="@{/portfolio}" class="topnav-link" th:classappend="${activeMenu == 'portfolio'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'portfolio'} ? 'page' : null">내 자산</a>
            <a th:href="@{/trade}" class="topnav-link" th:classappend="${activeMenu == 'tradelog'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'tradelog'} ? 'page' : null">매매 기록</a>
            <a th:href="@{/community}" class="topnav-link" th:classappend="${activeMenu == 'community'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'community'} ? 'page' : null">커뮤니티</a>
            <a th:href="@{/friends}" class="topnav-link" th:classappend="${activeMenu == 'friends'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'friends'} ? 'page' : null">친구</a>
        </nav>

        <div class="topnav-right">
            <details class="topnav-profile" th:if="${loginMember != null}">
                <summary class="profile-pill" aria-label="사용자 메뉴">
                    <span class="profile-avatar" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
                    <span class="profile-name" th:text="${loginMember.username}">사용자</span>
                    <i class="bi bi-chevron-down profile-chevron" aria-hidden="true"></i>
                </summary>
                <div class="profile-dropdown" role="menu">
                    <a th:href="@{/auth/info}" class="dropdown-btn" role="menuitem">내 정보</a>
                    <form th:action="@{/auth/logout}" method="post" class="m-0 mt-1">
                        <button type="submit" class="dropdown-btn logout-btn" role="menuitem">로그아웃</button>
                    </form>
                </div>
            </details>
            <a th:if="${loginMember == null}" th:href="@{/auth/login}" class="pill-dark topnav-login">로그인</a>
        </div>
    </div>
</header>

<nav class="mobile-tabbar" th:if="${loginMember != null}" aria-label="하단 메뉴">
    <a th:href="@{/}" class="mobile-tab" th:classappend="${activeMenu == 'home'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'home'} ? 'page' : null">
        <i class="bi" th:classappend="${activeMenu == 'home'} ? 'bi-house-door-fill' : 'bi-house-door'"></i><span>홈</span>
    </a>
    <a th:href="@{/market}" class="mobile-tab" th:classappend="${activeMenu == 'market'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'market'} ? 'page' : null">
        <i class="bi" th:classappend="${activeMenu == 'market'} ? 'bi-graph-up-arrow' : 'bi-graph-up'"></i><span>시장</span>
    </a>
    <a th:href="@{/portfolio}" class="mobile-tab" th:classappend="${activeMenu == 'portfolio'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'portfolio'} ? 'page' : null">
        <i class="bi" th:classappend="${activeMenu == 'portfolio'} ? 'bi-pie-chart-fill' : 'bi-pie-chart'"></i><span>내 자산</span>
    </a>
    <a th:href="@{/trade}" class="mobile-tab" th:classappend="${activeMenu == 'tradelog'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'tradelog'} ? 'page' : null">
        <i class="bi" th:classappend="${activeMenu == 'tradelog'} ? 'bi-journal-text' : 'bi-journal'"></i><span>매매기록</span>
    </a>
    <a th:href="@{/community}" class="mobile-tab" th:classappend="${activeMenu == 'community'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'community'} ? 'page' : null">
        <i class="bi" th:classappend="${activeMenu == 'community'} ? 'bi-chat-dots-fill' : 'bi-chat-dots'"></i><span>커뮤니티</span>
    </a>
    <a th:href="@{/friends}" class="mobile-tab" th:classappend="${activeMenu == 'friends'} ? 'active' : ''" th:attr="aria-current=${activeMenu == 'friends'} ? 'page' : null">
        <i class="bi" th:classappend="${activeMenu == 'friends'} ? 'bi-people-fill' : 'bi-people'"></i><span>친구</span>
    </a>
</nav>

<!-- 프로필 메뉴: 바깥을 누르거나 Esc를 누르면 닫는다 -->
<script th:inline="none">
    (function () {
        function closeAll(except) {
            document.querySelectorAll('details.topnav-profile[open]').forEach(function (d) { if (d !== except) d.removeAttribute('open'); });
        }
        document.addEventListener('click', function (e) { closeAll(e.target.closest ? e.target.closest('details.topnav-profile') : null); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(null); });
    })();

    // 숫자 갱신 반짝임: 화면이 다 그려진 뒤(1.5초 후)부터, 숫자 칸의 글자가 바뀌면 잠깐 .num-flash 를 붙인다
    (function () {
        if (!window.MutationObserver || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var SEL = '.num, .summary-value, .return-val, .price-main, .fx-rate, .profit-badge, .stat-chip .v, .weight-total';
        var last = new WeakMap();
        function flash(el) {
            var text = el.textContent.trim();
            if (!last.has(el)) { last.set(el, text); return; }   // 새로 그려진 칸(정렬·목록 갱신)은 반짝이지 않는다
            if (last.get(el) === text) return;
            last.set(el, text);
            el.classList.remove('num-flash');
            void el.offsetWidth;            // 같은 요소에 연달아 붙여도 다시 재생되게
            el.classList.add('num-flash');
        }
        function start() {
            document.querySelectorAll(SEL).forEach(function (el) { last.set(el, el.textContent.trim()); });
            new MutationObserver(function (records) {
                records.forEach(function (r) {
                    var node = r.target.nodeType === 3 ? r.target.parentElement : r.target;
                    var el = node && node.closest ? node.closest(SEL) : null;
                    if (el) flash(el);
                });
            }).observe(document.body, { subtree: true, childList: true, characterData: true });
        }
        window.addEventListener('load', function () { setTimeout(start, 1500); });
    })();
</script>
</div>
</html>
