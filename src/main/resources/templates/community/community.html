<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLog - 커뮤니티</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <!--
      커뮤니티 피드. 글 목록은 /api/community/posts 에서 커서로 이어 받는다(더 보기 때 페이지를 다시 그리지 않음).
      ?stock=005930 이면 그 종목이 태그된 글만 보여 준다.
      글·제목은 모두 x-text 로 넣는다(사용자 입력을 HTML 로 해석하지 않게 — XSS 방지).
    -->
    <style>
        :root { --content-max: 760px; --sheet-max: 560px; }

        .head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
        .btn-write { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; border: 0; padding: 10px 18px; border-radius: var(--radius-pill); font-weight: 700; font-size: 14px; transition: background-color .15s ease; }
        .btn-write:hover { background: var(--ink-body); color: #fff; }

        /* 종목 필터 */
        .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; padding: 12px 16px; background: var(--paper); border-radius: var(--radius-md); }
        .filter-bar .label { font-size: var(--fs-small); color: var(--label-text); font-weight: 600; }
        .filter-clear { margin-left: auto; font-size: var(--fs-small); font-weight: 700; color: var(--slate); text-decoration: none; padding: 6px 10px; border-radius: var(--radius-pill); }
        .filter-clear:hover { background: var(--canvas); color: var(--ink); }

        /* 종목 태그 칩 */
        .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--toss-blue-tint); color: var(--toss-blue-deep); font-size: var(--fs-small); font-weight: 700; text-decoration: none; white-space: nowrap; line-height: 1.4; }
        a.tag:hover { background: var(--toss-blue-tint-line); color: var(--toss-blue-deep); }
        .tag .code { font-weight: 600; opacity: .75; }

        /* 피드 카드: 제목 링크가 카드 전체를 덮고(stretched), 태그 링크만 그 위에 올린다 */
        .post-list { display: flex; flex-direction: column; gap: 12px; }
        .post-card { position: relative; background: var(--paper); border-radius: var(--card-radius); padding: 22px 24px; transition: box-shadow .15s ease; }
        .post-card:hover { box-shadow: var(--shadow-card); }
        .post-card:focus-within { outline: 2px solid var(--toss-blue); outline-offset: 2px; }
        .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; position: relative; z-index: 2; }
        .post-title { font-size: var(--fs-title); font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.45; margin: 0 0 6px; word-break: keep-all; overflow-wrap: anywhere; }
        .post-title a { color: inherit; text-decoration: none; outline: none; }
        .post-title a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 1; }
        .post-preview { font-size: var(--fs-emph); color: var(--slate); line-height: 1.6; margin: 0 0 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .post-meta { display: flex; align-items: center; gap: 14px; font-size: var(--fs-small); color: var(--label-text); font-weight: 500; flex-wrap: wrap; }
        .post-meta .author { color: var(--ink-body); font-weight: 700; }
        .post-meta .stat { display: inline-flex; align-items: center; gap: 4px; }
        .post-meta .stat i { color: var(--mist); }
        .post-meta .stat.liked i { color: var(--toss-red); }
        .post-meta .spacer { flex: 1 1 auto; }

        .state-box { background: var(--paper); border-radius: var(--card-radius); padding: 48px 24px; text-align: center; color: var(--label-text); }
        .state-box .title { font-size: var(--fs-list); font-weight: 700; color: var(--ink); margin-bottom: 6px; }
        .more-btn { width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: var(--radius-md); background: var(--paper); color: var(--slate); font-weight: 700; font-size: var(--fs-body); }
        .more-btn:hover:not(:disabled) { background: var(--canvas-hover); color: var(--ink); }
        .more-btn:disabled { opacity: .6; }

        /* 글쓰기 모달 */
        .field-label { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-small); font-weight: 700; color: var(--ink); margin: 0 0 8px 2px; }
        .field-label .count { font-weight: 500; color: var(--label-text); }
        .field { margin-bottom: 18px; }
        .toss-textarea { min-height: 200px; resize: vertical; line-height: 1.6; }
        .tag-picker { position: relative; }
        .tag-chosen { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .tag-chosen .tag button { border: 0; background: transparent; color: inherit; padding: 0 0 0 2px; line-height: 1; font-size: 15px; }
        .tag-results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--paper); border: 1px solid var(--hairline); border-radius: var(--radius-md); box-shadow: var(--shadow-dropdown); padding: 6px; max-height: 260px; overflow-y: auto; }
        .tag-result { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; text-align: left; font-size: var(--fs-emph); color: var(--ink); }
        .tag-result:hover, .tag-result:focus-visible { background: var(--canvas); outline: none; }
        .tag-result .code { color: var(--label-text); font-size: var(--fs-small); font-weight: 600; }
        .hint { font-size: var(--fs-caption); color: var(--label-text); margin: 6px 0 0 2px; }
        .form-error { background: var(--toss-red-tint); color: var(--toss-red-deep); font-weight: 600; font-size: var(--fs-small); border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 14px; }
        .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
        .sheet-actions .btn-cancel { flex: 0 0 auto; border: 0; background: var(--canvas); color: var(--ink); font-weight: 700; border-radius: var(--radius-md); padding: 14px 20px; }
        .sheet-actions .btn-primary-toss { flex: 1 1 auto; }

        .sk-card { background: var(--paper); border-radius: var(--card-radius); padding: 22px 24px; }

        @media (max-width: 768px) {
            .post-card, .sk-card { padding: 18px; border-radius: var(--card-radius-m); }
            .post-title { font-size: var(--fs-list); }
            .post-preview { font-size: var(--fs-body); }
            .modal-backdrop-custom { align-items: flex-end; }
            .modal-sheet { border-radius: var(--radius-lg) var(--radius-lg) 0 0; max-height: 92vh; }
        }
    </style>
</head>
<body>

<div class="layout-wrapper" x-data="communityApp">
    <aside th:replace="~{fragments/sidebar :: sidebarFragment('community')}"></aside>

    <main class="main-content">
        <div class="content-container">
            <div class="head-row">
                <h1 class="page-title">커뮤니티</h1>
                <button type="button" class="btn-write" @click="openWrite()" aria-haspopup="dialog">
                    <i class="bi bi-pencil-square" aria-hidden="true"></i>글쓰기
                </button>
            </div>

            <!-- 종목 필터 (?stock=) -->
            <div class="filter-bar" x-show="filter" x-cloak>
                <span class="label">종목별 글</span>
                <span class="tag" x-show="filter"><span x-text="filter && filter.name"></span><span class="code" x-text="filter && filter.code"></span></span>
                <a href="/community" class="filter-clear">전체 글 보기</a>
            </div>
            <div class="filter-bar" th:if="${param.stock != null and stockFilter == null}">
                <span class="label">찾을 수 없는 종목이라 전체 글을 보여 드려요.</span>
                <a href="/community" class="filter-clear">닫기</a>
            </div>

            <!-- 처음 불러오는 중 -->
            <div class="post-list" x-show="loading" aria-hidden="true">
                <template x-for="i in 3" :key="i">
                    <div class="sk-card">
                        <span class="skeleton" style="width: 90px; height: 22px; margin-bottom: 12px;"></span>
                        <span class="skeleton" style="width: 70%; height: 20px; margin-bottom: 10px;"></span>
                        <span class="skeleton" style="width: 95%; height: 14px; margin-bottom: 6px;"></span>
                        <span class="skeleton" style="width: 60%; height: 14px; margin-bottom: 16px;"></span>
                        <span class="skeleton" style="width: 40%; height: 12px;"></span>
                    </div>
                </template>
            </div>

            <!-- 실패 -->
            <div class="state-box" x-show="!loading && failed" x-cloak role="alert">
                <div class="title">글을 불러오지 못했어요</div>
                <div class="mb-3">잠시 후 다시 시도해 주세요.</div>
                <button type="button" class="pill-soft" @click="load()">다시 불러오기</button>
            </div>

            <!-- 비어 있음 -->
            <div class="state-box" x-show="!loading && !failed && posts.length === 0" x-cloak>
                <div class="title" x-text="filter ? '아직 이 종목 이야기가 없어요' : '아직 올라온 글이 없어요'"></div>
                <div class="mb-3">첫 글을 남겨 보세요.</div>
                <button type="button" class="pill-dark" @click="openWrite()">글쓰기</button>
            </div>

            <!-- 피드 -->
            <div class="post-list" x-show="!loading && posts.length > 0" x-cloak>
                <template x-for="p in posts" :key="p.id">
                    <article class="post-card">
                        <div class="post-tags" x-show="p.tags.length > 0">
                            <template x-for="t in p.tags" :key="t.code">
                                <a class="tag" :href="'/community?stock=' + encodeURIComponent(t.code)" x-text="'#' + t.name"></a>
                            </template>
                        </div>
                        <h2 class="post-title"><a :href="'/community/posts/' + p.id" x-text="p.title"></a></h2>
                        <p class="post-preview" x-show="p.preview" x-text="p.preview"></p>
                        <div class="post-meta">
                            <span class="author" x-text="p.authorName"></span>
                            <span x-text="timeAgo(p.createdAt)"></span>
                            <span class="spacer"></span>
                            <span class="stat" :class="p.liked && 'liked'" :aria-label="'좋아요 ' + p.likeCount">
                                <i class="bi" :class="p.liked ? 'bi-heart-fill' : 'bi-heart'" aria-hidden="true"></i><span x-text="compact(p.likeCount)"></span>
                            </span>
                            <span class="stat" :aria-label="'댓글 ' + p.commentCount">
                                <i class="bi bi-chat" aria-hidden="true"></i><span x-text="compact(p.commentCount)"></span>
                            </span>
                            <span class="stat" :aria-label="'조회 ' + p.viewCount">
                                <i class="bi bi-eye" aria-hidden="true"></i><span x-text="compact(p.viewCount)"></span>
                            </span>
                        </div>
                    </article>
                </template>
            </div>

            <button type="button" class="more-btn" x-show="!loading && hasNext" x-cloak @click="load(true)" :disabled="loadingMore">
                <span x-text="loadingMore ? '불러오는 중…' : '더 보기'"></span>
            </button>
            <p class="text-center small mt-3" style="color: var(--toss-red-deep);" x-show="moreError" x-cloak role="alert" x-text="moreError"></p>
        </div>
    </main>

    <!-- 글쓰기 -->
    <div x-show="showWrite" x-cloak class="modal-backdrop-custom" @click.self="closeWrite()">
        <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="write-title" tabindex="-1"
             x-dialog="showWrite" @keydown.escape.stop="closeWrite()">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 id="write-title" class="fw-bold m-0" style="font-size: var(--fs-title); color: var(--ink);">새 글</h2>
                <button type="button" class="btn-close shadow-none" aria-label="닫기" @click="closeWrite()"></button>
            </div>

            <form @submit.prevent="submit()" novalidate>
                <div class="form-error" x-show="formError" x-text="formError" role="alert"></div>

                <div class="field">
                    <div class="field-label"><span>종목 태그</span><span class="count" x-text="tags.length + ' / ' + MAX_TAGS"></span></div>
                    <div class="tag-chosen" x-show="tags.length > 0">
                        <template x-for="t in tags" :key="t.code">
                            <span class="tag"><span x-text="'#' + t.name"></span>
                                <button type="button" @click="removeTag(t.code)" :aria-label="t.name + ' 태그 빼기'">&times;</button>
                            </span>
                        </template>
                    </div>
                    <div class="tag-picker" @click.outside="results = []">
                        <input type="text" class="toss-input" x-model="query" @input.debounce.300ms="searchStocks()"
                               @keydown.enter.prevent="results.length && addTag(results[0])"
                               :disabled="tags.length >= MAX_TAGS"
                               :placeholder="tags.length >= MAX_TAGS ? '태그는 ' + MAX_TAGS + '개까지 붙일 수 있어요' : '종목명이나 코드로 찾기 (선택)'"
                               aria-label="종목 검색" autocomplete="off">
                        <div class="tag-results" x-show="results.length > 0" role="listbox">
                            <template x-for="s in results" :key="s.code">
                                <button type="button" class="tag-result" role="option" @click="addTag(s)">
                                    <span x-text="s.name"></span><span class="code" x-text="s.code"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <p class="hint">태그를 붙이면 그 종목 글 모아 보기에 나타나요.</p>
                </div>

                <div class="field">
                    <label class="field-label" for="w-title"><span>제목</span><span class="count" x-text="form.title.length + ' / ' + TITLE_MAX"></span></label>
                    <input id="w-title" type="text" class="toss-input" x-model="form.title" :maxlength="TITLE_MAX" placeholder="제목을 입력하세요">
                </div>
                <div class="field">
                    <label class="field-label" for="w-content"><span>내용</span><span class="count" x-text="form.content.length + ' / ' + CONTENT_MAX"></span></label>
                    <textarea id="w-content" class="toss-input toss-textarea" x-model="form.content" :maxlength="CONTENT_MAX"
                              placeholder="투자 아이디어나 생각을 나눠 보세요. 투자 판단과 책임은 본인에게 있어요."></textarea>
                </div>

                <div class="sheet-actions">
                    <button type="button" class="btn-cancel" @click="closeWrite()">취소</button>
                    <button type="submit" class="btn-primary-toss" :disabled="submitting || !form.title.trim() || !form.content.trim()">
                        <span x-text="submitting ? '올리는 중…' : '올리기'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // ?stock= 으로 들어온 종목 (없으면 null)
    const STOCK_FILTER_CODE = /*[[${stockFilter != null ? stockFilter.code() : null}]]*/ null;
    const STOCK_FILTER_NAME = /*[[${stockFilter != null ? stockFilter.name() : null}]]*/ null;
    const STOCK_FILTER = STOCK_FILTER_CODE ? { code: STOCK_FILTER_CODE, name: STOCK_FILTER_NAME } : null;

    document.addEventListener('alpine:init', () => {
        Alpine.data('communityApp', () => ({
            MAX_TAGS: 5, TITLE_MAX: 100, CONTENT_MAX: 5000,

            filter: STOCK_FILTER,
            posts: [], nextCursor: null, hasNext: false,
            loading: true, failed: false, loadingMore: false, moreError: '',

            showWrite: false, submitting: false, formError: '',
            form: { title: '', content: '' },
            tags: [], query: '', results: [], searchSeq: 0,

            init() { this.load(); },

            async load(more = false) {
                if (more) { this.loadingMore = true; this.moreError = ''; }
                else { this.loading = true; this.failed = false; }
                const params = new URLSearchParams();
                if (this.filter) params.set('stock', this.filter.code);
                if (more && this.nextCursor) params.set('cursor', this.nextCursor);
                try {
                    const data = await api('/api/community/posts?' + params);
                    this.posts = more ? this.posts.concat(data.items) : data.items;
                    this.nextCursor = data.nextCursor;
                    this.hasNext = data.hasNext;
                } catch (e) {
                    if (more) this.moreError = e.message || '더 불러오지 못했어요.';
                    else this.failed = true;
                } finally {
                    this.loading = false; this.loadingMore = false;
                }
            },

            // ── 글쓰기 ──
            openWrite() {
                this.formError = '';
                if (this.filter && this.tags.length === 0) this.tags = [{ ...this.filter }];
                this.showWrite = true;
            },
            closeWrite() {
                if (this.submitting) return;
                this.showWrite = false; this.results = []; this.query = '';
            },
            async searchStocks() {
                const q = this.query.trim();
                const seq = ++this.searchSeq;   // 늦게 도착한 이전 검색 결과가 덮어쓰지 않게
                if (!q) { this.results = []; return; }
                try {
                    const list = await api('/api/community/stocks?keyword=' + encodeURIComponent(q));
                    if (seq !== this.searchSeq) return;
                    const chosen = new Set(this.tags.map(t => t.code));
                    this.results = list.filter(s => !chosen.has(s.code));
                } catch (e) { if (seq === this.searchSeq) this.results = []; }
            },
            addTag(s) {
                if (this.tags.length >= this.MAX_TAGS || this.tags.some(t => t.code === s.code)) return;
                this.tags.push({ code: s.code, name: s.name });
                this.query = ''; this.results = [];
            },
            removeTag(code) { this.tags = this.tags.filter(t => t.code !== code); },

            async submit() {
                if (this.submitting) return;
                this.formError = '';
                this.submitting = true;
                try {
                    const res = await api('/api/community/posts', {
                        method: 'POST',
                        body: { title: this.form.title, content: this.form.content, stockCodes: this.tags.map(t => t.code) }
                    });
                    location.href = '/community/posts/' + res.id;
                } catch (e) {
                    this.formError = e.message || '글을 올리지 못했어요.';
                    this.submitting = false;
                }
            },

            timeAgo, compact
        }));
    });

    /** fetch + JSON. 실패하면 서버가 보낸 message 로 Error 를 던진다. 세션이 끊겨 로그인 화면으로 돌려지면 그쪽으로 이동 */
    async function api(url, { method = 'GET', body } = {}) {
        const res = await fetch(url, {
            method,
            headers: body ? { 'Content-Type': 'application/json', 'Accept': 'application/json' } : { 'Accept': 'application/json' },
            body: body ? JSON.stringify(body) : undefined
        });
        if (res.redirected && res.url.includes('/auth/login')) { location.href = res.url; throw new Error('로그인이 필요해요.'); }
        if (res.status === 204) return null;
        let data = null;
        try { data = await res.json(); } catch (_) { /* 본문 없음 */ }
        if (!res.ok) throw new Error((data && data.message) || '요청을 처리하지 못했어요.');
        return data;
    }

    function timeAgo(iso) {
        if (!iso) return '';
        const t = new Date(iso);
        const sec = Math.floor((Date.now() - t.getTime()) / 1000);
        if (sec < 60) return '방금 전';
        if (sec < 3600) return Math.floor(sec / 60) + '분 전';
        if (sec < 86400) return Math.floor(sec / 3600) + '시간 전';
        if (sec < 86400 * 7) return Math.floor(sec / 86400) + '일 전';
        const sameYear = t.getFullYear() === new Date().getFullYear();
        return (sameYear ? '' : t.getFullYear() + '. ') + (t.getMonth() + 1) + '. ' + t.getDate() + '.';
    }

    function compact(n) {
        if (n == null) return '0';
        if (n < 1000) return String(n);
        if (n < 10000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + '천';
        return (n / 10000).toFixed(1).replace(/\.0$/, '') + '만';
    }
</script>
</body>
</html>
