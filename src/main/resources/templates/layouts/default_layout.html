<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* 레이아웃 전용 스타일 내장 */
        :root {
            --toss-blue: #3182f6; --toss-gray-bg: #f2f4f6;
            --toss-gray-dark: #4e5968; --sidebar-width: 250px;
        }
        body { background-color: var(--toss-gray-bg); font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; margin: 0; }
        [x-cloak] { display: none !important; }

        .layout-wrapper { display: flex; min-height: 100vh; }
        .main-content {
            flex-grow: 1; margin-left: var(--sidebar-width); padding: 20px 60px 60px 60px;
            transition: 0.3s; width: calc(100% - var(--sidebar-width));
        }
        .main-content.expanded { margin-left: 80px; width: calc(100% - 80px); }
        .content-container { width: 100%; max-width: 1400px; margin: 0 auto; }
    </style>
</head>
<body x-data="{ sidebarOpen: true }">
<div class="layout-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebarFragment}"></div>

    <main class="main-content" :class="!sidebarOpen ? 'expanded' : ''">
        <div class="content-container">
            <div th:replace="~{fragments/header :: headerFragment}"></div>
            <div th:replace="${content}"></div>
        </div>
    </main>
</div>
</body>
</html>
