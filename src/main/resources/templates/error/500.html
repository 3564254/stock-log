<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서버 오류 - StockLog</title>
  <th:block th:replace="~{fragments/head :: assets}"></th:block>
  <style>
    :root {
        --page-top: 24px;
        --page-gutter: 24px;
        --page-bottom: 24px;
    }
    body { letter-spacing: -0.015em; }
    .main-content { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .error-card {
      background: #fff; border-radius: 24px; padding: 48px 40px; text-align: center;
      width: 100%; max-width: 480px; box-shadow: 0 2px 12px rgba(0,0,0,.04);
    }
    .error-icon {
      width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      background: var(--toss-red-tint); color: var(--toss-red-deep); font-size: 2.5rem;
    }
    .error-code { font-size: 13px; font-weight: 800; color: var(--toss-red-deep); letter-spacing: .08em; margin-bottom: 8px; }
    .error-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; word-break: keep-all; }
    .error-desc { font-size: 15px; color: var(--slate); line-height: 1.65; margin-bottom: 24px; word-break: keep-all; }
    .alert-box {
      background: rgba(240,68,82,.05); border: 1px solid rgba(240,68,82,.15); border-radius: 16px;
      padding: 14px 16px; margin-bottom: 24px; text-align: left; word-break: break-word;
    }
    .alert-box .alert-label { font-size: 13px; font-weight: 800; color: var(--toss-red-deep); margin-bottom: 4px; }
    .alert-box .alert-body { font-size: 13px; color: var(--slate); font-weight: 600; }
    .btn-main { background: var(--toss-blue-deep); border: none; color: #fff; }
    .btn-main:hover { background: var(--toss-blue-press); color: #fff; }
    .btn-sub { background: var(--hairline); border: none; color: var(--slate); }
    .btn-sub:hover { background: var(--haze); color: var(--ink); }

    @media (max-width: 768px) {
      .error-card { padding: 36px 24px; border-radius: 20px; }
    }
  </style>
</head>
<body>
<div class="layout-wrapper">
  <aside th:replace="~{fragments/sidebar :: sidebarFragment('none')}"></aside>
  <main class="main-content">
    <div class="error-card" role="alert">
      <div class="error-icon"><i class="bi bi-tools"></i></div>
      <div class="error-code">500</div>
      <h1 class="error-title">일시적인 오류가 발생했어요</h1>
      <p class="error-desc">서비스 이용에 불편을 드려 죄송해요.<br>잠시 후 다시 시도해 주세요. 계속되면 문의해 주세요.</p>

      <div th:if="${errorMessage != null}" class="alert-box">
        <div class="alert-label"><i class="bi bi-info-circle-fill me-1"></i>오류 상세 정보</div>
        <div class="alert-body" th:text="${errorMessage}"></div>
      </div>

      <button type="button" onclick="location.reload()" class="btn btn-main w-100 py-3 rounded-4 fw-bold mb-2">다시 시도하기</button>
      <a th:href="@{/}" class="btn btn-sub w-100 py-3 rounded-4 fw-bold">홈으로 돌아가기</a>
    </div>
  </main>
</div>
</body>
</html>
