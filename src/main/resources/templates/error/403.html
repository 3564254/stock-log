<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>접근 권한 없음 - StockLog</title>
    <th:block th:replace="~{fragments/head :: assets}"></th:block>
    <style>
    :root {
        --page-top: 24px;
        --page-gutter: 24px;
        --page-bottom: 24px;
    }
        body { letter-spacing: -0.015em; }
        .main-content { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-card {
            background: #fff; border-radius: 24px; padding: 48px 40px; text-align: center;
            width: 100%; max-width: 480px; box-shadow: 0 2px 12px rgba(0,0,0,.04);
        }
        .error-icon {
            width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 24px;
            display: flex; align-items: center; justify-content: center;
            background: var(--caution-tint); color: var(--caution-text); font-size: 2.5rem;
        }
        .error-code { font-size: 13px; font-weight: 800; color: var(--caution-text); letter-spacing: .08em; margin-bottom: 8px; }
        .error-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; word-break: keep-all; }
        .error-desc { font-size: 15px; color: var(--slate); line-height: 1.65; margin-bottom: 32px; word-break: keep-all; }
        .btn-main { background: var(--toss-blue-deep); border: none; color: #fff; }
        .btn-main:hover { background: var(--toss-blue-press); color: #fff; }
        .btn-sub { background: var(--hairline); border: none; color: var(--slate); }
        .btn-sub:hover { background: var(--haze); color: var(--ink); }

        @media (max-width: 768px) {
            .error-card { padding: 36px 24px; border-radius: 20px; }
        }
    </style>
</head>
<body>
<div class="layout-wrapper">
    <aside th:replace="~{fragments/sidebar :: sidebarFragment('none')}"></aside>
    <main class="main-content">
        <div class="error-card" role="alert">
            <div class="error-icon"><i class="bi bi-shield-lock-fill"></i></div>
            <div class="error-code">403</div>
            <h1 class="error-title">접근 권한이 없어요</h1>
            <p class="error-desc"
               th:text="${errorMessage != null ? errorMessage : '이 페이지를 볼 수 있는 권한이 없거나, 다른 사용자의 자산에 접근하려고 했어요.'}"></p>
            <a th:href="@{/}" class="btn btn-main w-100 py-3 rounded-4 fw-bold mb-2">메인으로 돌아가기</a>
            <a th:href="@{/auth/login}" class="btn btn-sub w-100 py-3 rounded-4 fw-bold">다른 계정으로 로그인</a>
        </div>
    </main>
</div>
</body>
</html>
