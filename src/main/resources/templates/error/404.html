<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>페이지를 찾을 수 없음 - StockLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --toss-blue: #3182f6; --toss-gray-bg: #f2f4f6; --sidebar-width: 250px; }
        body { background-color: var(--toss-gray-bg); font-family: 'Noto Sans KR', sans-serif; margin: 0; }
        .layout-wrapper { display: flex; min-height: 100vh; }
        .main-content {
            flex-grow: 1; margin-left: var(--sidebar-width);
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .error-box { text-align: center; max-width: 480px; padding: 40px; }
    </style>
</head>
<body>
<div class="layout-wrapper">
    <aside th:replace="~{fragments/sidebar :: sidebarFragment('none')}"></aside>
    <main class="main-content">
        <div class="error-box">
            <i class="bi bi-exclamation-triangle-fill text-warning mb-4" style="font-size: 4rem;"></i>
            <h1 class="fw-bold mb-3">페이지를 찾을 수 없어요</h1>
            <p class="text-secondary mb-5">주소가 잘못되었거나 삭제된 페이지입니다.</p>
            <a th:href="@{/}" class="btn btn-primary w-100 py-3 rounded-4 fw-bold" style="background: var(--toss-blue);">홈으로 돌아가기</a>
        </div>
    </main>
</div>
</body>
</html>
