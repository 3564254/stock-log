<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>페이지를 찾을 수 없음 - StockLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
    <style>
        :root { --toss-blue: #3182f6; --toss-gray-bg: #f2f4f6; --text-dark: #191f28; --sidebar-width: 250px; }
        body { background-color: var(--toss-gray-bg); font-family: 'Pretendard', sans-serif; margin: 0; color: var(--text-dark); letter-spacing: -0.015em;}
        .layout-wrapper { display: flex; min-height: 100vh; }
        .main-content {
            flex-grow: 1; margin-left: var(--sidebar-width);
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .error-box { text-align: center; max-width: 480px; padding: 40px; }
        .error-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
        .error-desc { font-size: 15px; color: #4e5968; line-height: 1.6; margin-bottom: 40px; }

        /* 모바일 대응 (에러 페이지 공통) */
        @media (max-width: 768px) {
            .sidebar-main { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 20px !important; }
            .error-box { padding: 20px !important; width: 100%; }
        }
    </style>
</head>
<body>
<div class="layout-wrapper">
    <aside th:replace="~{fragments/sidebar :: sidebarFragment('none')}"></aside>
    <main class="main-content">
        <div class="error-box">
            <i class="bi bi-search text-secondary mb-4 d-block" style="font-size: 4rem; opacity: 0.5;"></i>
            <h1 class="error-title">페이지를 찾을 수 없어요</h1>
            <p class="error-desc" th:text="${errorMessage != null ? errorMessage : '요청하신 리소스가 삭제되었거나, 주소가 잘못 입력되었습니다.'}"></p>
            <button onclick="history.back()" class="btn btn-light w-100 py-3 rounded-4 fw-bold mb-2" style="color: #4e5968; background: #e5e8eb; border: none;">이전 페이지로</button>
            <a th:href="@{/}" class="btn btn-primary w-100 py-3 rounded-4 fw-bold" style="background: var(--toss-blue); border: none;">홈으로 돌아가기</a>
        </div>
    </main>
</div>
</body>
</html>
