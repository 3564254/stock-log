<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockLog - 회원가입</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
  <style>
    :root { --toss-blue: #3182f6; --toss-gray-bg: #f2f4f6; --toss-gray-dark: #4e5968; --toss-red: #f04452; }
    body { background-color: var(--toss-gray-bg); font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 0; margin: 0; color: #191f28; }

    .auth-card { background: white; width: 100%; max-width: 440px; border-radius: 20px; padding: 48px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); border: 1px solid #e5e8eb; }
    .toss-input { width: 100%; border: 1px solid #e5e8eb; background-color: #f9fafb; border-radius: 12px; padding: 16px; outline: none; transition: 0.15s; font-size: 15px; font-weight: 500; font-family: 'Pretendard', sans-serif; }
    .toss-input:focus { border-color: var(--toss-blue); background: white; }

    /* 에러 발생 시 입력창 스타일 */
    .toss-input.is-invalid { border-color: #ffe5e5; background-color: #fff4f4; }
    .toss-input.is-invalid:focus { border-color: var(--toss-red); }

    .btn-primary-toss { background: var(--toss-blue); color: white; border: none; border-radius: 12px; padding: 16px; font-weight: 700; width: 100%; transition: 0.15s; font-size: 16px; }
    .btn-primary-toss:hover { opacity: 0.9; }
    .text-sub { color: #6b7684; }

    /* 에러 메시지 스타일 */
    .error-msg { color: #d63a48; font-size: 12px; font-weight: 500; margin-top: 6px; }
    .global-error { background-color: #fff4f4; color: #d63a48; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 13px; margin-bottom: 24px; border: 1px solid #ffe5e5; }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .auth-card { padding: 40px 24px !important; border-radius: 16px; }
      .btn-primary-toss { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="mb-5">
    <h1 class="fw-bold m-0 text-dark" style="font-size: 26px;">회원가입</h1>
    <p class="text-sub fw-medium mt-2" style="font-size: 15px;">나만의 투자 원칙을 만들어 보세요.</p>
  </div>

  <form th:action="@{/auth/signup}" th:object="${signupRequest}" method="post" class="d-flex flex-column gap-3">

    <div th:if="${errorMessage}" class="global-error d-flex align-items-center">
      <i class="bi bi-exclamation-circle me-2 fs-6"></i>
      <span th:text="${errorMessage}">이미 사용 중인 아이디입니다.</span>
    </div>

    <div>
      <label class="fw-bold mb-2 d-block" style="color: #4e5968; font-size: 13px;">이름</label>
      <input type="text" th:field="*{username}" class="toss-input"
             th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
             placeholder="사용할 이름을 입력해 주세요">
      <div class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">이름 오류</div>
    </div>

    <div>
      <label class="fw-bold mb-2 d-block" style="color: #4e5968; font-size: 13px;">아이디</label>
      <input type="text" th:field="*{loginId}" class="toss-input"
             th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid' : ''"
             placeholder="영문, 숫자 포함 4~20자">
      <div class="error-msg" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">아이디 오류</div>
    </div>

    <div>
      <label class="fw-bold mb-2 d-block" style="color: #4e5968; font-size: 13px;">비밀번호</label>
      <input type="password" th:field="*{password}" class="toss-input"
             th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
             placeholder="영문, 숫자 포함 8자 이상">
      <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">비밀번호 오류</div>
    </div>

    <div class="mb-3">
      <label class="fw-bold mb-2 d-block" style="color: #4e5968; font-size: 13px;">비밀번호 확인</label>
      <input type="password" th:field="*{passwordConfirm}" class="toss-input"
             th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid' : ''"
             placeholder="비밀번호를 한 번 더 입력해 주세요">
      <div class="error-msg" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}">비밀번호가 일치하지 않습니다.</div>
    </div>

    <button type="submit" class="btn-primary-toss mt-2">가입하기</button>
  </form>

  <div class="text-center mt-4 pt-2">
    <a th:href="@{/auth/login}" class="text-sub text-decoration-none fw-bold" style="font-size: 14px;">이미 계정이 있나요? 로그인하기</a>
  </div>
</div>

</body>
</html>
