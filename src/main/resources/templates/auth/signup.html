<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockLog - 회원가입</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --toss-blue: #3182f6; --toss-gray-bg: #f2f4f6; --toss-gray-dark: #4e5968; --toss-red: #f04452; }
    body { background-color: var(--toss-gray-bg); font-family: 'Noto Sans KR', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 0; margin: 0; }

    .auth-card { background: white; width: 100%; max-width: 480px; border-radius: 32px; padding: 56px 48px; box-shadow: 0 4px 24px rgba(0,0,0,0.03); }
    .toss-input { width: 100%; border: none; background-color: #f2f4f6; border-radius: 16px; padding: 16px; outline: none; transition: 0.2s; }
    .toss-input:focus { background-color: #e5e8eb; box-shadow: 0 0 0 2px var(--toss-blue); }

    /* 에러 발생 시 입력창 스타일 */
    .toss-input.is-invalid { box-shadow: 0 0 0 2px var(--toss-red); background-color: #fff0f0; }

    .btn-primary-toss { background: var(--toss-blue); color: white; border: none; border-radius: 18px; padding: 18px; font-weight: 700; width: 100%; transition: 0.2s; }
    .btn-primary-toss:hover { opacity: 0.9; }
    .text-sub { color: var(--toss-gray-dark); }

    /* 에러 메시지 스타일 */
    .error-msg { color: var(--toss-red); font-size: 0.85rem; font-weight: 500; margin-top: 6px; margin-left: 4px; }
    .global-error { background-color: #fff0f0; color: var(--toss-red); padding: 14px; border-radius: 14px; font-weight: 700; font-size: 0.9rem; margin-bottom: 24px; }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="mb-5">
    <h1 class="fw-bold fs-2" style="color: #191f28;">회원가입</h1>
    <p class="text-sub fw-medium">StockLog와 함께 똑똑한 투자를 시작해요.</p>
  </div>

  <form th:action="@{/auth/signup}" th:object="${signupRequest}" method="post" class="d-flex flex-column gap-3">

    <div th:if="${errorMessage}" class="global-error">
      <i class="bi bi-exclamation-circle me-2"></i>
      <span th:text="${errorMessage}">이미 사용 중인 아이디입니다.</span>
    </div>

    <div>
      <label class="fw-bold small mb-2 d-block ms-1">이름</label>
      <input type="text" th:field="*{username}" class="toss-input"
             th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
             placeholder="실명을 입력해주세요">
      <div class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">이름 오류</div>
    </div>

    <div>
      <label class="fw-bold small mb-2 d-block ms-1">아이디</label>
      <input type="text" th:field="*{loginId}" class="toss-input"
             th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid' : ''"
             placeholder="영문, 숫자 포함 4~20자">
      <div class="error-msg" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">아이디 오류</div>
    </div>

    <div>
      <label class="fw-bold small mb-2 d-block ms-1">비밀번호</label>
      <input type="password" th:field="*{password}" class="toss-input"
             th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
             placeholder="영문, 숫자 포함 8자 이상">
      <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">비밀번호 오류</div>
    </div>

    <div class="mb-3">
      <label class="fw-bold small mb-2 d-block ms-1">비밀번호 확인</label>
      <input type="password" th:field="*{passwordConfirm}" class="toss-input"
             th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid' : ''"
             placeholder="한 번 더 입력">
      <div class="error-msg" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}">비밀번호가 일치하지 않습니다.</div>
    </div>

    <button type="submit" class="btn-primary-toss fs-5">가입하기</button>
  </form>

  <div class="text-center mt-5">
    <a th:href="@{/auth/login}" class="text-sub small text-decoration-none fw-bold">이미 계정이 있나요? 로그인하기</a>
  </div>
</div>

</body>
</html>
