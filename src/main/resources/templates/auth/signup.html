<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockLog - 회원가입</title>
  <th:block th:replace="~{fragments/head :: assets}"></th:block>
  <style>
    :root {
        --toss-gray-dark: var(--slate);
    }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; min-height: 100vh; padding: 40px 16px; }

    /* 랜딩·상단 내비게이션과 같은 로고 */
    .auth-logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
    .auth-logo:hover { color: var(--ink); opacity: .85; }
    .auth-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--ink); display: grid; place-items: center; }
    .auth-mark i { color: #fff; font-size: 15px; }
    .auth-logo span:last-child { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }

    .auth-card { background: var(--paper); width: 100%; max-width: 440px; border-radius: 24px; padding: 44px 40px; }
    .auth-title { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-strong); margin: 0; }
    .auth-sub { font-size: 15px; font-weight: 500; color: var(--text-muted); margin: 8px 0 0; word-break: keep-all; }
    .auth-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--text-sub); }
    .auth-error-box { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-radius: 14px; background: var(--toss-red-tint); color: var(--toss-red-deep); font-size: 13px; font-weight: 600; }
    .auth-foot { text-align: center; font-size: 14px; font-weight: 500; color: var(--text-muted); }
    .auth-link { margin-left: 6px; font-weight: 700; color: var(--ink); text-decoration: none; }
    .auth-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    .toss-input { padding: 16px; }
    .field-hint { color: var(--label-text); font-size: 13px; font-weight: 500; margin-top: 6px; }
    .btn-primary-toss:focus-visible, .auth-link:focus-visible { outline: 2px solid var(--toss-blue); outline-offset: 2px; }

    /* 에러 발생 시 입력창 스타일 */
    .toss-input.is-invalid { border-color: var(--toss-red-deep); background-color: var(--toss-red-tint); }
    .toss-input.is-invalid:focus { border-color: var(--toss-red); }

    .text-sub { color: var(--label-text); }

    /* 에러 메시지 스타일 */
    .error-msg { color: var(--toss-red-deep); font-size: 13px; font-weight: 600; margin-top: 6px; }
    .global-error { background-color: var(--toss-red-tint); color: var(--toss-red-deep); padding: 14px 16px; border-radius: 14px; font-weight: 600; font-size: 13px; margin-bottom: 8px; }

    @media (max-width: 768px) {
      body { padding: 32px 16px; gap: 20px; }
      .auth-card { padding: 32px 22px !important; border-radius: 20px; }
      .btn-primary-toss { padding: 16px; }
    }
  </style>
</head>
<body>

<a th:href="@{/}" class="auth-logo" aria-label="StockLog 홈으로">
  <span class="auth-mark" aria-hidden="true"><i class="bi bi-bar-chart-fill"></i></span><span>StockLog</span>
</a>

<div class="auth-card">
  <div class="mb-4 pb-2">
    <h1 class="auth-title">회원가입</h1>
    <p class="auth-sub">매매 규칙을 정해 두고, 사기 전에 확인해요.</p>
  </div>

  <form th:action="@{/auth/signup}" th:object="${signupRequest}" method="post" class="d-flex flex-column gap-3"
        onsubmit="this.querySelector('[type=submit]').disabled = true">
    <th:block th:with="formError=${#fields.hasGlobalErrors() ? #fields.globalErrors()[0] : errorMessage}">

    <div th:if="${formError}" class="global-error d-flex align-items-center" role="alert">
      <i class="bi bi-exclamation-circle me-2 fs-6" aria-hidden="true"></i>
      <span th:text="${formError}">이미 사용 중인 아이디입니다.</span>
    </div>

    <div>
      <label for="username" class="auth-label">이름</label>
      <input type="text" th:field="*{username}" class="toss-input"
             th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
             th:attr="aria-invalid=${#fields.hasErrors('username')} ? 'true' : 'false',
                      aria-describedby=${#fields.hasErrors('username')} ? 'username-error' : null"
             placeholder="2~10자로 입력해 주세요" required minlength="2" maxlength="10" autocomplete="nickname">
      <div id="username-error" class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">오류</div>
    </div>

    <div>
      <label for="loginId" class="auth-label">아이디</label>
      <input type="text" th:field="*{loginId}" class="toss-input"
             th:classappend="${#fields.hasErrors('loginId')} ? 'is-invalid' : ''"
             th:attr="aria-invalid=${#fields.hasErrors('loginId')} ? 'true' : 'false',
                      aria-describedby=${#fields.hasErrors('loginId')} ? 'loginId-error' : null"
             placeholder="4~20자로 입력해 주세요" required minlength="4" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false">
      <div id="loginId-error" class="error-msg" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">오류</div>
    </div>

    <div>
      <label for="password" class="auth-label">비밀번호</label>
      <input type="password" th:field="*{password}" class="toss-input"
             th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
             th:attr="aria-invalid=${#fields.hasErrors('password')} ? 'true' : 'false',
                      aria-describedby=${#fields.hasErrors('password')} ? 'password-error' : 'password-hint'"
             placeholder="영문, 숫자 포함 8자 이상" required minlength="8" autocomplete="new-password">
      <div id="password-hint" class="field-hint">영문과 숫자를 모두 넣어 8자 이상으로 만들어 주세요</div>
      <div id="password-error" class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">오류</div>
    </div>

    <div class="mb-3">
      <label for="passwordConfirm" class="auth-label">비밀번호 확인</label>
      <input type="password" th:field="*{passwordConfirm}" class="toss-input"
             th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid' : ''"
             th:attr="aria-invalid=${#fields.hasErrors('passwordConfirm')} ? 'true' : 'false',
                      aria-describedby=${#fields.hasErrors('passwordConfirm')} ? 'passwordConfirm-error' : null"
             placeholder="비밀번호를 한 번 더 입력해 주세요" required autocomplete="new-password">
      <div id="passwordConfirm-error" class="error-msg" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}">오류</div>
    </div>

    <button type="submit" class="btn-primary-toss mt-2">가입하기</button>
    </th:block>
  </form>

  <div class="auth-foot mt-4 pt-1">
    이미 계정이 있나요?<a th:href="@{/auth/login}" class="auth-link">로그인</a>
  </div>
</div>

</body>
</html>
