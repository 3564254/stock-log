<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockLog - 로그인</title>
  <th:block th:replace="~{fragments/head :: assets}"></th:block>
  <style>
    :root {
        --toss-gray-dark: var(--slate);
    }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .auth-card { background: white; width: 100%; max-width: 420px; border-radius: 20px; padding: 48px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); border: 1px solid var(--hairline); }
    .toss-input { padding: 16px; }
    .toss-input[aria-invalid="true"] { background: var(--toss-red-tint); }
    .btn-primary-toss:focus-visible, .auth-link:focus-visible { outline: 2px solid var(--toss-blue); outline-offset: 2px; }

    .text-sub { color: var(--label-text); }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .auth-card { padding: 40px 24px !important; border-radius: 16px; }
      .btn-primary-toss { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-5">
    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 56px; height: 56px; background-color: rgba(49, 130, 246, 0.08);">
      <i class="bi bi-bar-chart-fill text-primary" style="font-size: 24px;" aria-hidden="true"></i>
    </div>
    <h1 class="fw-bold m-0 text-dark" style="font-size: 24px;">로그인</h1>
    <p class="text-sub mt-2 fw-medium" style="font-size: 15px;">오늘도 성공적인 투자를 기록해 보세요.</p>
  </div>
  <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post" class="d-flex flex-column gap-3"
        onsubmit="this.querySelector('[type=submit]').disabled = true">
    <th:block th:with="formError=${#fields.hasGlobalErrors() ? #fields.globalErrors()[0] : errorMessage}">

    <div th:if="${formError}" id="login-error" class="p-3 rounded-3 mb-2 fw-bold" role="alert" style="background-color: var(--toss-red-tint); border: 1px solid var(--toss-red-tint-line); color: var(--toss-red-deep); font-size: 13px;">
      <i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>
      <span th:text="${formError}">오류 메시지</span>
    </div>

    <div>
      <label for="loginId" class="fw-bold mb-2 d-block" style="color: var(--slate); font-size: 13px;">아이디</label>
      <input type="text" th:field="*{loginId}" class="toss-input" placeholder="아이디를 입력해 주세요" required
             autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"
             th:autofocus="${!#fields.hasErrors('password')}"
             th:attr="aria-invalid=${#fields.hasErrors('loginId') or formError != null} ? 'true' : 'false',
                      aria-describedby=${#fields.hasErrors('loginId')} ? 'loginId-error' : (${formError != null} ? 'login-error' : null)">
      <div id="loginId-error" class="mt-1 fw-semibold" style="color: var(--toss-red-deep); font-size: 13px;" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">아이디 오류</div>
    </div>

    <div class="mb-2">
      <label for="password" class="fw-bold mb-2 d-block" style="color: var(--slate); font-size: 13px;">비밀번호</label>
      <input type="password" th:field="*{password}" class="toss-input" placeholder="비밀번호를 입력해 주세요" required
             autocomplete="current-password"
             th:autofocus="${#fields.hasErrors('password')}"
             th:attr="aria-invalid=${#fields.hasErrors('password') or formError != null} ? 'true' : 'false',
                      aria-describedby=${#fields.hasErrors('password')} ? 'password-error' : (${formError != null} ? 'login-error' : null)">
      <div id="password-error" class="mt-1 fw-semibold" style="color: var(--toss-red-deep); font-size: 13px;" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">비밀번호 오류</div>
    </div>

    <button type="submit" class="btn-primary-toss mt-2">로그인</button>
    </th:block>
  </form>

  <div class="text-center mt-4 pt-2">
    <span class="text-sub fw-medium" style="font-size: 14px;">처음이신가요?</span>
    <a th:href="@{/auth/signup}" class="ms-2 fw-bold text-decoration-none auth-link" style="color: var(--toss-blue-deep); font-size: 14px;">회원가입 하기</a>
  </div>
</div>

</body>
</html>
