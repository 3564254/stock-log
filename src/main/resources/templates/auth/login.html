<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockLog - 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --toss-blue: #3182f6; --toss-gray-bg: #f2f4f6; --toss-gray-dark: #4e5968; }
    body { background-color: var(--toss-gray-bg); font-family: 'Noto Sans KR', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }

    .auth-card { background: white; width: 100%; max-width: 450px; border-radius: 32px; padding: 56px 48px; box-shadow: 0 4px 24px rgba(0,0,0,0.03); }
    .toss-input { width: 100%; border: none; background-color: #f2f4f6; border-radius: 16px; padding: 18px; font-size: 1.05rem; outline: none; transition: 0.2s; }
    .toss-input:focus { background-color: #e5e8eb; box-shadow: 0 0 0 2px var(--toss-blue); }

    .btn-primary-toss { background: var(--toss-blue); color: white; border: none; border-radius: 18px; padding: 18px; font-weight: 700; width: 100%; transition: 0.2s; }
    .btn-primary-toss:hover { opacity: 0.9; transform: translateY(-1px); }
    .text-sub { color: var(--toss-gray-dark); }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-5">
    <div class="bg-white shadow-sm d-inline-flex align-items-center justify-content-center rounded-4 mb-4" style="width: 72px; height: 72px; border: 1px solid #f2f4f6;">
      <i class="bi bi-bar-chart-fill text-primary fs-1"></i>
    </div>
    <h1 class="fw-bold fs-2" style="color: #191f28;">StockLog 로그인</h1>
    <p class="text-sub mt-2 fw-medium">반가워요! 주식 기록을 시작해볼까요?</p>
  </div>
  <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post" class="d-flex flex-column gap-4">

    <div th:if="${errorMessage}" class="p-3 rounded-4 mb-2 small fw-bold" style="background-color: #fff0f0; color: #f04452;">
      <i class="bi bi-exclamation-circle me-2"></i>
      <span th:text="${errorMessage}">오류 메시지</span>
    </div>

    <div>
      <label class="fw-bold small mb-2 d-block ms-1" style="color: #4e5968;">아이디</label>
      <input type="text" th:field="*{loginId}" class="toss-input" placeholder="아이디 입력" required>
      <div class="text-danger small mt-1 ms-1" th:errors="*{loginId}">아이디 오류</div>
    </div>

    <div>
      <label class="fw-bold small mb-2 d-block ms-1" style="color: #4e5968;">비밀번호</label>
      <input type="password" th:field="*{password}" class="toss-input" placeholder="비밀번호 입력" required>
      <div class="text-danger small mt-1 ms-1" th:errors="*{password}">비밀번호 오류</div>
    </div>

    <button type="submit" class="btn-primary-toss fs-5 mt-2">로그인</button>
  </form>

  <div class="text-center mt-5">
    <span class="text-sub small fw-medium">처음이신가요?</span>
    <a th:href="@{/auth/signup}" class="ms-2 fw-bold text-decoration-none" style="color: var(--toss-blue);">회원가입 하기</a>
  </div>
</div>

</body>
</html>
