<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockLog - 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
  <style>
    :root { --toss-blue: #3182f6; --toss-gray-bg: #f2f4f6; --toss-gray-dark: #4e5968; --toss-red: #f04452; }
    body { background-color: var(--toss-gray-bg); font-family: 'Pretendard', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: #191f28; }

    .auth-card { background: white; width: 100%; max-width: 420px; border-radius: 20px; padding: 48px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); border: 1px solid #e5e8eb; }
    .toss-input { width: 100%; border: 1px solid #e5e8eb; background-color: #f9fafb; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 500; outline: none; transition: 0.15s; font-family: 'Pretendard', sans-serif; }
    .toss-input:focus { border-color: var(--toss-blue); background: white; }

    .btn-primary-toss { background: var(--toss-blue); color: white; border: none; border-radius: 12px; padding: 16px; font-weight: 700; width: 100%; transition: 0.15s; font-size: 16px; }
    .btn-primary-toss:hover { opacity: 0.9; }
    .text-sub { color: #6b7684; }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .auth-card { padding: 40px 24px !important; border-radius: 16px; }
      .btn-primary-toss { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-5">
    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 56px; height: 56px; background-color: rgba(49, 130, 246, 0.08);">
      <i class="bi bi-bar-chart-fill text-primary" style="font-size: 24px;"></i>
    </div>
    <h1 class="fw-bold m-0 text-dark" style="font-size: 24px;">로그인</h1>
    <p class="text-sub mt-2 fw-medium" style="font-size: 15px;">오늘도 성공적인 투자를 기록해 보세요.</p>
  </div>
  <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post" class="d-flex flex-column gap-3">

    <div th:if="${errorMessage}" class="p-3 rounded-3 mb-2 fw-bold" style="background-color: #fff4f4; border: 1px solid #ffe5e5; color: #d63a48; font-size: 13px;">
      <i class="bi bi-exclamation-circle me-1"></i>
      <span th:text="${errorMessage}">오류 메시지</span>
    </div>

    <div>
      <label class="fw-bold mb-2 d-block" style="color: #4e5968; font-size: 13px;">아이디</label>
      <input type="text" th:field="*{loginId}" class="toss-input" placeholder="아이디를 입력해 주세요" required>
      <div class="small mt-1 fw-medium" style="color: #d63a48; font-size: 12px;" th:errors="*{loginId}">아이디 오류</div>
    </div>

    <div class="mb-2">
      <label class="fw-bold mb-2 d-block" style="color: #4e5968; font-size: 13px;">비밀번호</label>
      <input type="password" th:field="*{password}" class="toss-input" placeholder="비밀번호를 입력해 주세요" required>
      <div class="small mt-1 fw-medium" style="color: #d63a48; font-size: 12px;" th:errors="*{password}">비밀번호 오류</div>
    </div>

    <button type="submit" class="btn-primary-toss mt-2">로그인</button>
  </form>

  <div class="text-center mt-4 pt-2">
    <span class="text-sub fw-medium" style="font-size: 14px;">처음이신가요?</span>
    <a th:href="@{/auth/signup}" class="ms-2 fw-bold text-decoration-none" style="color: var(--toss-blue); font-size: 14px;">회원가입 하기</a>
  </div>
</div>

</body>
</html>
