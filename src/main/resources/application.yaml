spring:
  application:
    name: StockLog
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/testdb;MODE=MySQL  # 기존: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # TODO(JPA): 개발 편의의 ddl-auto:update는 운영 스키마 변경을 안전하게 관리하지 못한다.
    # profile별로 validate를 사용하고 Flyway/Liquibase 같은 migration 도구로 스키마 변경 이력을 관리해 보자.
    show-sql: false
    hibernate:
      ddl-auto: update


    # TODO(JPA): OSIV의 사용 여부를 명시적으로 결정하자. false로 두면 Controller/View에서의 지연 로딩을 막아
    # N+1을 빨리 발견할 수 있지만, 필요한 데이터는 Service 트랜잭션 안에서 DTO로 완성해야 한다.
    # open-in-view: false
  thymeleaf:
    encoding: UTF-8
    mode: HTML
    cache: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true




kis:
  app-key: ${KIS_APP_KEY}
  app-secret: ${KIS_APP_SECRET}
  base-url: https://openapi.koreainvestment.com:9443
kexim:
  auth-key: {KEXIM_AUTH_KEY}
twelve:
  auth-key: {TWELVE_AUTH_KEY}
exchange:
  auth-key: {EXCHANGE_AUTH_KEY}

gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent
    key: {GEMINI_API_KEY}

finnhub:
  api:
    key: {FINNHUB_API_KEY}
    secret: {FINNHUB_SECRET}

fred:
  api:
    key: {FRED_API_KEY}
alpha:
  api:
    key: {ALPHA_API_KEY}

toss:
  api:
    key: {TOSS_API_KEY}
    secret: {TOSS_SECRET}

server:
  servlet:
    session:
      tracking-modes: cookie
